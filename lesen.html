<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 25px 15px;
    min-height: 100vh;
    background:

    background-position: center;
    background-attachment: fixed;

}

.container { max-width: 850px; margin: auto; }

header { text-align: center; margin-bottom: 28px; }

header h1 {
    color: #60a5fa;
    font-size: 30px;
    margin-bottom: 8px;
}

header p { color: #cbd5e1; }

.progress-area { margin-bottom: 20px; }

.progress-text {
    display: flex;
    justify-content: space-between;
    color: #cbd5e1;
    font-size: 14px;
    margin-bottom: 9px;
}

.progress-bar {
    height: 8px;

    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;

}

.card {
    background: rgba(23,32,51,.96);

    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;

}

.topic {

    font-size: 14px;
    font-weight: bold;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.passage {
    color: #f1f5f9;
    font-size: 17px;
    line-height: 1.9;
    white-space: pre-wrap;
}

.passage-word {
    cursor: pointer;
    border-radius: 4px;
}

.passage-word:hover {
    background: #334b70;
    color: #93c5fd;
}

.hint {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 17px;
    font-style: italic;
}

.question {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 20px;
}

.choice {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border: 2px solid #344258;
    border-radius: 10px;
    background: #202d43;
    color: #e5e7eb;
    text-align: left;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
}

.choice:hover:not(:disabled) {
    border-color: #60a5fa;
    background: #263b59;
}

.choice:disabled { cursor: default; opacity: 1; }

.choice.correct {
    border-color: #22c55e;
    background: #123c30;
    color: #bbf7d0;
}

.choice.wrong {
    border-color: #ef4444;
    background: #451f2a;
    color: #fecaca;
}

.feedback {
    display: none;
    padding: 20px;
    margin-top: 22px;
    border-radius: 12px;
    background: #202d43;
    border: 1px solid #3b4d68;
    line-height: 1.7;
}

.feedback h3 { margin-top: 0; }

.good { color: #4ade80; }
.bad { color: #f87171; }

.evidence {
    padding: 13px;
    margin: 12px 0;
    border-left: 4px solid #60a5fa;
    background: #15243a;
    color: #bfdbfe;
    border-radius: 5px;

.next-button, .retry-button {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;

.next-button:hover, .retry-button:hover { background: #1d4ed8; }

.next-button:disabled {

.result {

    text-align: center;

.result h2 { color: #60a5fa; font-size: 28px; }

.score-number {

    color: #4ade80;
    margin: 20px 0;
}

.result-detail {

    line-height: 2;
    color: #cbd5e1;
}

.word-popup {

    justify-content: center;

.popup-content {

    padding: 25px;

.popup-content h2 {

.word-meaning {

    color: #f8fafc;

.word-pos, .word-plural {

    margin-top: 8px;

.word-status {

    font-size: 13px;
    margin-top: 12px;
}

.close-popup {

    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    background: #334155;
    color: white;
    cursor: pointer;
    font-size: 15px;

@media(max-width:600px) {

    header h1 { font-size: 25px; }
    .passage { font-size: 16px; }

}
</style>
</head>

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function renderPassage(text) {
    const element = document.getElementById("passage");
    element.innerHTML = "";

    const parts = text.split(/([\p{L}ÄÖÜäöüß]+(?:[-'][\p{L}ÄÖÜäöüß]+)*)/gu);

    parts.forEach(part => {
        if (/^[\p{L}ÄÖÜäöüß]+(?:[-'][\p{L}ÄÖÜäöüß]+)*$/u.test(part)) {
            const span = document.createElement("span");
            span.className = "passage-word";
            span.textContent = part;
            span.title = "Bấm để tra từ";
            span.addEventListener("click", () => lookupWord(part));
            element.appendChild(span);
        } else {
            element.appendChild(document.createTextNode(part));
        }
    });
}

function findLocalWord(word) {
    const lower = word.toLowerCase();

    if (vocabulary[lower]) return vocabulary[lower];

    const capitalized = lower.charAt(0).toUpperCase() + lower.slice(1);
    if (vocabulary[capitalized]) return vocabulary[capitalized];

    // Thử tìm dạng gốc đơn giản của một số từ biến đổi
    const endings = ["ern", "em", "er", "en", "es", "e", "st", "te", "ten", "t"];

    for (const ending of endings) {
        if (lower.length > ending.length + 3 && lower.endsWith(ending)) {
            const stem = lower.slice(0, -ending.length);
            if (vocabulary[stem]) return vocabulary[stem];

            const stemCapitalized = stem.charAt(0).toUpperCase() + stem.slice(1);
            if (vocabulary[stemCapitalized]) return vocabulary[stemCapitalized];
        }
    }

    return null;
}

function normalizeEntry(entry) {
    if (Array.isArray(entry)) {
        return {
            meaning: entry[0] || "",
            pos: entry[1] || "",
            plural: entry[2] || ""
        };
    }

    return {
        meaning: entry.meaning || entry.vi || "",
        pos: entry.pos || "",
        plural: entry.plural || ""
    };
}

    });

    const response = await fetch(
        "https://api.mymemory.translated.net/get?" + params.toString()
    );

    if (!response.ok) {
        throw new Error("Dịch vụ dịch đang gặp sự cố.");
    }

    const data = await response.json();

    if (Number(data.responseStatus) !== 200 ||
        !data.responseData ||
        !data.responseData.translatedText) {
        throw new Error(data.responseDetails || "Không tìm thấy bản dịch.");
    }

    return data.responseData.translatedText;
}

// ------------------------------------------------------------
// TRA TỪ LOẠI VÀ SỐ NHIỀU TỪ WIKTIONARY
// ------------------------------------------------------------

async function getWiktionaryInfo(word) {
    const params = new URLSearchParams({
        action: "parse",
        page: word,
        prop: "wikitext",
        format: "json",
        origin: "*"
    });

    const url = "https://de.wiktionary.org/w/api.php?" + params.toString();

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("Không thể truy cập Wiktionary.");
    }

    const data = await response.json();

    if (!data.parse || !data.parse.wikitext) {
        return { pos: "", plural: "" };
    }

    const wikiText = typeof data.parse.wikitext === "string"
        ? data.parse.wikitext
        : data.parse.wikitext["*"] || "";

    let pos = "";
    let plural = "";

    // Nhận diện một số loại từ qua mẫu tiêu đề tiếng Đức
    if (/Wortart\|Substantiv\|Deutsch/i.test(wikiText)) {
        pos = "Danh từ";
    } else if (/Wortart\|Verb\|Deutsch/i.test(wikiText)) {
        pos = "Động từ";
    } else if (/Wortart\|Adjektiv\|Deutsch/i.test(wikiText)) {
        pos = "Tính từ";
    } else if (/Wortart\|Adverb\|Deutsch/i.test(wikiText)) {
        pos = "Trạng từ";
    } else if (/Wortart\|Pronomen\|Deutsch/i.test(wikiText)) {
        pos = "Đại từ";
    } else if (/Wortart\|Präposition\|Deutsch/i.test(wikiText)) {
        pos = "Giới từ";
    } else if (/Wortart\|Konjunktion\|Deutsch/i.test(wikiText)) {
        pos = "Liên từ";
    }

    // Thử lấy số nhiều từ các tham số thường gặp
    const pluralPatterns = [
        /\|\s*Nominativ Plural\s*=\s*([^\n|}]+)/i,
        /\|\s*Nominativ Plural 1\s*=\s*([^\n|}]+)/i,
        /\|\s*Plural\s*=\s*([^\n|}]+)/i,
        /\|\s*Pl\s*=\s*([^\n|}]+)/i
    ];

    for (const pattern of pluralPatterns) {
        const match = wikiText.match(pattern);
        if (match && match[1]) {
            plural = match[1].replace(/<.*?>/g, "").trim();
            break;
        }
    }

    return { pos, plural };
}

// ------------------------------------------------------------
// HIỂN THỊ TỪ ĐIỂN
// ------------------------------------------------------------

function showWordPopup(word, entry, status) {
    document.getElementById("popup-word").textContent = word;
    document.getElementById("popup-meaning").textContent =
        entry.meaning || "Chưa có nghĩa tiếng Việt.";

    document.getElementById("popup-pos").textContent =
        "Từ loại: " + (entry.pos || "Chưa xác định");

    document.getElementById("popup-plural").textContent =
        entry.plural
            ? "Số nhiều: " + entry.plural
            : (entry.pos === "Danh từ" || /danh từ/i.test(entry.pos || "")
                ? "Số nhiều: Chưa tìm thấy dữ liệu"
                : "Số nhiều: Không áp dụng");

    document.getElementById("popup-status").textContent = status;
    document.getElementById("word-popup").style.display = "flex";
}

async function lookupWord(word) {
    document.getElementById("popup-word").textContent = word;
    document.getElementById("popup-meaning").textContent = "Đang tra nghĩa...";
    document.getElementById("popup-pos").textContent = "";
    document.getElementById("popup-plural").textContent = "";
    document.getElementById("popup-status").textContent = "Đang kết nối từ điển trực tuyến...";
    document.getElementById("word-popup").style.display = "flex";

    // Ưu tiên từ điển CSV và từ điển tích hợp
    const localEntry = findLocalWord(word);

    if (localEntry) {
        const entry = normalizeEntry(localEntry);
        showWordPopup(word, entry, "Nguồn: Từ điển cá nhân / words.csv");
        return;
    }

    // Kiểm tra bộ nhớ đệm trực tuyến
    const cache = getOnlineCache();
    const cacheKey = word.toLowerCase();

    if (cache[cacheKey]) {
        showWordPopup(word, cache[cacheKey], "Nguồn: Bộ nhớ từ điển đã lưu");
        return;
    }

    try {
        // Hai dịch vụ được gọi độc lập
        const translationPromise = translateGermanToVietnamese(word);
        const wikiPromise = getWiktionaryInfo(word).catch(() => ({
            pos: "",
            plural: ""
        }));

        const [meaning, wikiInfo] = await Promise.all([
            translationPromise,
            wikiPromise
        ]);

        const entry = {
            meaning: meaning,
            pos: wikiInfo.pos || "Chưa xác định",
            plural: wikiInfo.plural || ""
        };

        cache[cacheKey] = entry;
        saveOnlineCache(cache);

        showWordPopup(word, entry, "Nguồn: MyMemory + Wiktionary");
    } catch (error) {
        document.getElementById("popup-meaning").textContent =
            "Không thể tra trực tuyến lúc này.";

        document.getElementById("popup-pos").textContent =
            "Cậu hãy kiểm tra kết nối Internet.";

        document.getElementById("popup-plural").textContent = "";

        document.getElementById("popup-status").textContent =
            error.message || "Đã xảy ra lỗi.";
    }
}

function closePopup() {
    document.getElementById("word-popup").style.display = "none";
}

function closePopupOutside(event) {
    if (event.target.id === "word-popup") closePopup();
}

// ------------------------------------------------------------
// BẮT ĐẦU BÀI LUYỆN
// ------------------------------------------------------------

function startQuiz() {
    quizTasks = shuffle(allTasks);
    currentIndex = 0;
    correctCount = 0;
    answered = false;

    document.getElementById("quiz-area").style.display = "block";
    document.getElementById("result").style.display = "none";

    showQuestion();
}

// ------------------------------------------------------------
// HIỂN THỊ CÂU HỎI
// ------------------------------------------------------------

function showQuestion() {
    answered = false;

    const task = quizTasks[currentIndex];

    document.getElementById("progress-text").textContent =
        "Bài đọc " + (currentIndex + 1) + " / " + quizTasks.length;

    document.getElementById("score-text").textContent =
        "Đúng: " + correctCount;

    document.getElementById("progress-fill").style.width =
        (currentIndex / quizTasks.length * 100) + "%";

    document.getElementById("topic").textContent = task.title;
    renderPassage(task.text);

    document.getElementById("question").textContent = task.question;

    const buttonA = document.getElementById("choice-A");
    const buttonB = document.getElementById("choice-B");

    buttonA.textContent = "A. " + task.a;
    buttonB.textContent = "B. " + task.b;

    buttonA.disabled = false;
    buttonB.disabled = false;

    buttonA.className = "choice";
    buttonB.className = "choice";

    document.getElementById("feedback").style.display = "none";

    const nextButton = document.getElementById("next-button");
    nextButton.disabled = true;
    nextButton.textContent = "Chọn đáp án trước nhé";
}

// ------------------------------------------------------------
// KIỂM TRA ĐÁP ÁN VÀ GIẢI THÍCH
// ------------------------------------------------------------

function selectAnswer(selected) {
    if (answered) return;

    answered = true;

    const task = quizTasks[currentIndex];
    const isCorrect = selected === task.answer;

    const buttonA = document.getElementById("choice-A");
    const buttonB = document.getElementById("choice-B");

    buttonA.disabled = true;
    buttonB.disabled = true;

    const correctButton = task.answer === "A" ? buttonA : buttonB;
    const selectedButton = selected === "A" ? buttonA : buttonB;

    correctButton.classList.add("correct");

    if (!isCorrect) {
        selectedButton.classList.add("wrong");
    } else {
        correctCount++;
    }

    document.getElementById("score-text").textContent =
        "Đúng: " + correctCount;

    const title = document.getElementById("feedback-title");

    if (isCorrect) {
        title.textContent = "Sehr gut! Chính xác!";
        title.className = "good";
    } else {
        title.textContent = "Chưa chính xác rồi cậu!";
        title.className = "bad";
    }

    const correctText = task.answer === "A" ? task.a : task.b;

    document.getElementById("correct-answer").textContent =
        "Đáp án đúng: " + task.answer + ". " + correctText;

    // Câu tiếng Đức làm căn cứ cho đáp án
    document.getElementById("evidence-text").textContent =
        task.evidence || "Thông tin nằm trong nội dung bài đọc.";

    document.getElementById("explanation").textContent =
        "Giải thích tiếng Việt: " + task.explanation;

    document.getElementById("other-answer").textContent =
        "Vì sao phương án còn lại sai? " + task.wrong_reason;

    document.getElementById("feedback").style.display = "block";

    const nextButton = document.getElementById("next-button");
    nextButton.disabled = false;

    nextButton.textContent =
        currentIndex === quizTasks.length - 1
            ? "Xem kết quả"
            : "Câu tiếp theo →";
}

// ------------------------------------------------------------
// CHUYỂN CÂU THỦ CÔNG
// ------------------------------------------------------------

function nextQuestion() {
    if (!answered) return;

    currentIndex++;

    if (currentIndex < quizTasks.length) {
        showQuestion();
    } else {
        showResult();
    }
}

// ------------------------------------------------------------
// KẾT QUẢ CUỐI LƯỢT
// ------------------------------------------------------------

function showResult() {
    document.getElementById("quiz-area").style.display = "none";

    const result = document.getElementById("result");
    result.style.display = "block";

    const total = quizTasks.length;
    const incorrectCount = total - correctCount;
    const percentage = Math.round(correctCount / total * 100);

    document.getElementById("progress-fill").style.width = "100%";

    document.getElementById("final-score").textContent =
        correctCount + " / " + total;

    document.getElementById("result-detail").innerHTML =
        "✅ Số câu đúng: <strong>" + correctCount + "</strong><br>" +
        "❌ Số câu sai: <strong>" + incorrectCount + "</strong><br>" +
        "📊 Tỷ lệ chính xác: <strong>" + percentage + "%</strong>";
}

// Bắt đầu chương trình
startQuiz();

</script>
