<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fa">
<title>Đang khởi tạo môi trường...</title>
<style>
* { box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #f7f8fa;
}

#mainSite {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    opacity: 0;
    visibility: hidden;
    background: #fff;
    transition: opacity .65s ease, visibility .65s ease;
}

#mainSite.is-ready {
    opacity: 1;
    visibility: visible;
}

#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f7f8fa;
    opacity: 1;
    visibility: visible;
    transition: opacity .65s ease, visibility .65s ease;
}

#loadingScreen.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loading-message {
    margin: 0;
    color: #697582;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: clamp(13px, 2vw, 15px);
    font-weight: 400;
    letter-spacing: .045em;
    text-align: center;
    animation: softBlink 2.1s ease-in-out infinite;
}

.loading-line {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 2px;
    overflow: hidden;
    background: #e7eaee;
}

.loading-line::after {
    content: "";
    display: block;
    width: 28%;
    height: 100%;
    background: #9aa6b2;
    animation: progressMove 1.8s ease-in-out infinite;
}

@keyframes softBlink {
    0%, 100% { opacity: .62; }
    50% { opacity: 1; }
}

@keyframes progressMove {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(460%); }
}

@media (prefers-reduced-motion: reduce) {
    .loading-message,
    .loading-line::after {
        animation: none;
    }

    #mainSite,
    #loadingScreen {
        transition: none;
    }
}
</style>
</head>
<body>

<!-- Tải index ở chế độ ẩn; index tiếp tục tải home.html theo cấu trúc vốn có. -->
<iframe id="mainSite" src="index.html" title="Deutsch Lernen"></iframe>

<!-- Màn hình chờ độc lập -->
<main id="loadingScreen" role="status" aria-live="polite">
    <p class="loading-message">Đang khởi tạo môi trường...</p>
    <div class="loading-line" aria-hidden="true"></div>
</main>

<script>
(function () {
    const site = document.getElementById("mainSite");
    const screen = document.getElementById("loadingScreen");
    let hasShownSite = false;

    function showMainSite() {
        if (hasShownSite) return;
        hasShownSite = true;

        // Sự kiện load của iframe ngoài chỉ chạy sau khi tài liệu index
        // và các iframe/tài nguyên phụ thuộc bên trong hoàn tất tải.
        site.classList.add("is-ready");
        screen.classList.add("is-hidden");

        window.setTimeout(function () {
            screen.remove();
        }, 750);
    }

    site.addEventListener("load", showMainSite, { once: true });
})();
</script>

</body>
</html>
