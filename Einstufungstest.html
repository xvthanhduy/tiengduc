<script>
const WORKER_URL='https://german-einstufung-ai.xv-thanhduy.workers.dev';

const skillOrder=[
  {id:'Aussprache',name:'Aussprache – Phát âm',seconds:600},
  {id:'Hören',name:'Hören – Nghe',seconds:1200},
  {id:'Sprechen',name:'Sprechen – Nói',seconds:900},
  {id:'Lesen',name:'Lesen – Đọc',seconds:1500},
  {id:'Schreiben',name:'Schreiben – Viết',seconds:1800}
];

let profile={},
    skillIndex=0,
    activeTest=null,
    answers={},
    results=[],
    timerId=null,
    remaining=0,
    planData=null,
    recognition=null;

const $=id=>document.getElementById(id);

function show(id){
  ['profileScreen','introScreen','testScreen','resultScreen','planScreen']
    .forEach(x=>$(x).classList.toggle('hidden',x!==id));

  window.scrollTo({top:0,behavior:'smooth'});
}

document.querySelectorAll('.choices').forEach(group=>
  group.addEventListener('click',e=>{
    let b=e.target.closest('.choice');
    if(!b)return;

    group.querySelectorAll('.choice')
      .forEach(x=>x.classList.toggle('active',x===b));

    if(group.dataset.group==='motivation'){
      $('otherReason').classList.toggle(
        'hidden',
        b.dataset.value!=='Lý do khác'
      );
    }
  })
);

// ==========================================
// KẾT NỐI WORKER RIÊNG CỦA EINSTUFUNGSTEST
// ==========================================

async function api(payload){
  let r;

  try{
    r=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
  }catch(e){
    throw new Error(
      'Không kết nối được Cloudflare Worker. Cậu kiểm tra Worker đã Deploy và kết nối mạng nhé.'
    );
  }

  let d=await r.json().catch(() => ({
    error:'Worker không trả về JSON hợp lệ.'
  }));

  if(!r.ok){
    throw new Error(d.details||d.error||'Không thể kết nối AI');
  }

  return d;
}

// ==========================================
// HỒ SƠ NGƯỜI HỌC
// ==========================================

$('continueProfile').onclick=()=>{
  profile.studied=
    document.querySelector('[data-group="studied"] .active').dataset.value;

  profile.currentLevel=$('currentLevel').value;

  profile.motivation=
    document.querySelector('[data-group="motivation"] .active').dataset.value;

  profile.otherReason=$('otherReason').value.trim();

  if(profile.motivation==='Lý do khác'&&!profile.otherReason){
    alert('Cậu hãy nhập lý do học tiếng Đức nhé.');
    return;
  }

  profile.motivationDetail=
    profile.motivation==='Lý do khác'
      ?profile.otherReason
      :profile.motivation;

  $('profileSummary').textContent=
    `Thông tin ban đầu: ${profile.studied}; trình độ tự đánh giá: ${profile.currentLevel}; mục tiêu: ${profile.motivationDetail}.`;

  show('introScreen');
};

$('backProfile').onclick=()=>show('profileScreen');

$('startTest').onclick=async()=>{
  skillIndex=0;
  answers={};
  results=[];
  await loadSkill();
};

// ==========================================
// TẠO BÀI KIỂM TRA TỪ AI
// ==========================================

async function loadSkill(){
  clearInterval(timerId);
  answers={};

  let sk=skillOrder[skillIndex];

  show('testScreen');

  $('skillCount').textContent=`Kỹ năng ${skillIndex+1}/5`;
  $('skillTitle').textContent=sk.name;
  $('taskArea').innerHTML='';
  $('passage').classList.add('hidden');

  $('skillInstruction').textContent=
    'AI đang chuẩn bị bài kiểm tra phù hợp với hồ sơ của bạn...';

  $('submitSkill').disabled=true;
  $('submitSkill').textContent='Nộp bài và tiếp tục';

  try{
    let d=await api({
      mode:'generate',
      skill:sk.id,
      currentLevel:profile.currentLevel,
      motivation:profile.motivationDetail
    });

    if(!d.test||!Array.isArray(d.test.tasks)||!d.test.tasks.length){
      throw new Error(
        'AI chưa tạo được bộ câu hỏi hợp lệ. Cậu hãy thử lại.'
      );
    }

    activeTest=d.test;

    renderSkill(sk,activeTest);

    remaining=sk.seconds;
    updateTimer();

    timerId=setInterval(()=>{
      remaining--;
      updateTimer();

      if(remaining<=0){
        clearInterval(timerId);
        finishSkill(true);
      }
    },1000);

  }catch(e){
    alert('Không thể tạo bài kiểm tra: '+e.message);
    show('introScreen');
  }
}

// ==========================================
// HIỂN THỊ CÂU HỎI
// ==========================================

function renderSkill(sk,t){
  $('skillInstruction').textContent=
    t.instruction||'Hãy hoàn thành các nhiệm vụ trong thời gian quy định.';

  if(t.passage){
    $('passage').textContent=t.passage;
    $('passage').classList.remove('hidden');
  }

  if(sk.id==='Hören'&&t.listeningScript){
    let a=document.createElement('button');

    a.className='secondary';
    a.textContent='▶ Nghe đoạn tiếng Đức';

    a.onclick=()=>{
      speechSynthesis.cancel();

      let u=new SpeechSynthesisUtterance(t.listeningScript);
      u.lang='de-DE';
      u.rate=.88;

      speechSynthesis.speak(u);
    };

    $('taskArea').append(a);
  }

  let area=$('taskArea');

  (t.tasks||[]).forEach((task,i)=>{
    let box=document.createElement('div');
    box.className='task';

    let h=document.createElement('h3');
    h.textContent=`${i+1}. ${task.prompt}`;

    box.append(h);

    if(task.options?.length){
      task.options.forEach((op,j)=>{
        let b=document.createElement('button');

        b.className='opt';
        b.textContent=
          typeof op==='string'
            ?op
            :op.text||op.label;

        b.onclick=()=>{
          box.querySelectorAll('.opt')
            .forEach(x=>x.classList.remove('active'));

          b.classList.add('active');

          answers[i]={
            value:typeof op==='string'
              ?op
              :(op.label||op.text),
            index:j
          };
        };

        box.append(b);
      });

    }else if(sk.id==='Aussprache'||sk.id==='Sprechen'){
      let speak=document.createElement('button');

      speak.className='secondary';
      speak.textContent='🎙️ Đọc câu trả lời';

      speak.onclick=()=>startRecognition(i,input);

      box.append(speak);

      let input=document.createElement('textarea');

      input.rows=2;

      input.placeholder=
        sk.id==='Aussprache'
          ?'Transcript nhận diện hoặc tự nhập câu cậu vừa đọc'
          :'Nhập nội dung trả lời hoặc dùng nút đọc bằng giọng nói';

      input.addEventListener('input',()=>{
        answers[i]={value:input.value};
      });

      box.append(input);

    }else{
      let input=document.createElement('textarea');

      input.placeholder='Viết câu trả lời của bạn tại đây...';

      if(sk.id==='Schreiben'){
        input.addEventListener('paste',e=>{
          e.preventDefault();

          alert(
            'Phần Schreiben không cho phép dán nội dung. Cậu hãy tự nhập bài làm nhé.'
          );
        });

        input.addEventListener('drop',e=>e.preventDefault());
        input.addEventListener('contextmenu',e=>e.preventDefault());
      }

      input.addEventListener('input',()=>{
        answers[i]={value:input.value};
      });

      box.append(input);
    }

    area.append(box);
  });

  $('submitSkill').disabled=false;
}

// ==========================================
// NHẬN DIỆN GIỌNG NÓI
// ==========================================

function startRecognition(i,input){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SR){
    alert(
      'Trình duyệt này chưa hỗ trợ nhận diện giọng nói. Cậu có thể tự nhập transcript.'
    );
    return;
  }

  if(recognition)recognition.stop();

  recognition=new SR();
  recognition.lang='de-DE';
  recognition.interimResults=false;

  recognition.onresult=e=>{
    input.value=e.results[0][0].transcript;

    answers[i]={
      value:input.value,
      recognitionConfidence:e.results[0][0].confidence
    };
  };

  recognition.onerror=()=>{
    alert(
      'Không nhận diện được giọng nói. Cậu thử lại hoặc nhập transcript.'
    );
  };

  recognition.start();
}

// ==========================================
// ĐỒNG HỒ ĐẾM NGƯỢC
// ==========================================

function updateTimer(){
  let m=Math.floor(remaining/60);
  let s=remaining%60;

  $('timer').textContent=
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  $('skillProgress').style.width=
    `${100*(1-remaining/skillOrder[skillIndex].seconds)}%`;
}

$('submitSkill').onclick=()=>finishSkill(false);

// ==========================================
// GỬI BÀI LÀM ĐẾN AI ĐỂ CHẤM ĐIỂM
// ==========================================

async function finishSkill(auto){
  clearInterval(timerId);

  if(recognition)recognition.stop();

  $('submitSkill').disabled=true;

  $('skillInstruction').textContent=
    auto
      ?'Đã hết giờ. Bài làm đã được khóa, hệ thống đang chấm điểm...'
      :'Đã nộp bài. Hệ thống đang chấm điểm...';

  document.querySelectorAll(
    '#taskArea input,#taskArea textarea,#taskArea button'
  ).forEach(x=>x.disabled=true);

  try{
    let d=await api({
      mode:'evaluate',
      skill:skillOrder[skillIndex].id,
      currentLevel:profile.currentLevel,
      profile,
      test:activeTest,
      answers
    });

    results.push(d.evaluation);

    skillIndex++;

    if(skillIndex<5){
      await loadSkill();
    }else{
      await finishAll();
    }

  }catch(e){
    alert(
      'Lỗi khi chấm bài: '+e.message+
      '\nBài làm vẫn được giữ lại. Bấm “Thử chấm lại” để gửi lại cho AI.'
    );

    $('submitSkill').textContent='Thử chấm lại';
    $('submitSkill').disabled=false;
  }
}

// ==========================================
// TỔNG HỢP KẾT QUẢ 5 KỸ NĂNG
// ==========================================

async function finishAll(){
  show('resultScreen');

  $('overallResults').innerHTML=
    '<p>AI đang tổng hợp kết quả năm kỹ năng...</p>';

  try{
    let profileText=JSON.stringify({profile,results});

    let d=await api({
      mode:'evaluate',
      skill:'Gesamtauswertung',
      currentLevel:profile.currentLevel,
      profile:profileText,
      test:{title:'Tổng hợp 5 kỹ năng'},
      answers:{summary:JSON.stringify(results)}
    });

    // Đánh giá tổng thể cuối cùng
    let overall=d.evaluation;

    $('overallResults').innerHTML='';

    results.forEach(r=>{
      let el=document.createElement('div');

      el.className='result-card';

      el.innerHTML=
        `<strong>${escapeHtml(r.skill||'Kỹ năng')}</strong> · ${escapeHtml(r.estimatedLevel||'Chưa xác định')} · ${Number(r.score)||0}/100<p>${escapeHtml(r.feedback||'')}</p>`;

      $('overallResults').append(el);
    });

    let sum=document.createElement('div');

    sum.className='result-card';

    sum.innerHTML=
      `<strong>Đánh giá tổng thể tham chiếu: ${escapeHtml(overall.estimatedLevel||'Cần đánh giá thêm')}</strong><p>${escapeHtml(overall.feedback||'Kết quả được tổng hợp từ các kỹ năng.')}</p>`;

    $('overallResults').append(sum);

    profile.overall=overall;

  }catch(e){
    $('overallResults').textContent=
      'Đã hoàn thành 5 kỹ năng. Kết quả từng phần được lưu trong phiên này; tổng hợp AI chưa thực hiện được: '+e.message;
  }
}

// ==========================================
// HÀM BẢO VỆ NỘI DUNG HTML
// ==========================================

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

// ==========================================
// LỰA CHỌN MỤC TIÊU HỌC TẬP
// ==========================================

$('personalizeGoal').onclick=()=>{
  $('goalFields').classList.toggle('hidden');
  $('improveFields').classList.add('hidden');
};

$('improveGerman').onclick=()=>{
  $('improveFields').classList.toggle('hidden');
  $('goalFields').classList.add('hidden');
};

$('selfStudy').onclick=()=>location.href='index.html';

// ==========================================
// AI TẠO LỘ TRÌNH HỌC TẬP 12 TUẦN
// ==========================================

async function createPlan(targetLevel,examName,reason){
  $('overallResults').insertAdjacentHTML(
    'beforeend',
    '<p id="planLoading">AI đang phân tích và xây dựng lộ trình cá nhân...</p>'
  );

  try{
    let d=await api({
      mode:'plan',
      profile:JSON.stringify({profile,results,overall:profile.overall}),
      targetLevel,
      examName,
      reason
    });

    planData=d.plan;

    renderPlan(planData);

    show('planScreen');

  }catch(e){
    alert('Chưa thể tạo lộ trình: '+e.message);
    $('planLoading')?.remove();
  }
}

$('makeGoalPlan').onclick=()=>{
  let exam=$('examName').value.trim();

  if(!exam){
    alert('Cậu hãy nhập tên kỳ thi nhé.');
    return;
  }

  createPlan(
    $('targetLevel').value,
    exam,
    'Mục tiêu đạt chứng chỉ '+exam
  );
};

$('makeImprovePlan').onclick=()=>{
  let reason=$('improveReason').value.trim();

  if(!reason){
    alert('Cậu hãy nhập điều muốn cải thiện nhé.');
    return;
  }

  createPlan('', '', reason);
};

// ==========================================
// HIỂN THỊ LỘ TRÌNH
// ==========================================

function renderPlan(p){
  let root=$('planContent');

  root.innerHTML=
    `<div class="result-card"><strong>${escapeHtml(p.headline)}</strong><p>${escapeHtml(p.summary)}</p><p>Trình độ hiện tại ước lượng: ${escapeHtml(p.startingLevel)} · Mục tiêu: ${escapeHtml(p.target)}</p></div>`;

  (p.weeklyPlan||[]).forEach(w=>{
    let d=document.createElement('div');

    d.className='result-card';

    d.innerHTML=
      `<strong>${escapeHtml(w.week)} · ${escapeHtml(w.focus)}</strong><ul>${(w.activities||[]).map(a=>'<li>'+escapeHtml(a)+'</li>').join('')}</ul><p>Mốc đánh giá: ${escapeHtml(w.milestone)}</p>`;

    root.append(d);
  });

  let sched=document.createElement('div');

  sched.className='result-card';

  sched.innerHTML=
    '<strong>Lịch học gợi ý</strong>'+
    (p.weeklySchedule||[]).map(x=>
      `<p><b>${escapeHtml(x.day)}</b> · ${escapeHtml(x.duration)}<br>${(x.activities||[]).map(escapeHtml).join(' · ')}</p>`
    ).join('');

  root.append(sched);

  let metrics=document.createElement('div');

  metrics.className='result-card';

  metrics.innerHTML=
    '<strong>Tiêu chí theo dõi tiến bộ</strong><ul>'+
    (p.successMetrics||[]).map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+
    '</ul><p>'+escapeHtml(p.note||'')+'</p>';

  root.append(metrics);
}

// ==========================================
// LƯU LỘ TRÌNH VÀO LỊCH CÁ NHÂN
// ==========================================

$('saveCalendar').onclick=()=>{
  if(!planData)return;

  let key='personalStudyCalendar_v1';
  let items=[];

  try{
    items=JSON.parse(localStorage.getItem(key)||'[]');

    if(!Array.isArray(items))items=[];

  }catch{}

  items.push({
    id:'plan-'+Date.now(),
    type:'learning-plan',
    title:planData.headline||'Lộ trình tiếng Đức cá nhân',
    createdAt:new Date().toISOString(),
    startingLevel:planData.startingLevel,
    target:planData.target,
    weeklyPlan:planData.weeklyPlan||[],
    weeklySchedule:planData.weeklySchedule||[],
    successMetrics:planData.successMetrics||[],
    source:'Einstufungstest'
  });

  localStorage.setItem(key,JSON.stringify(items));

  $('savedMessage').classList.remove('hidden');
  $('saveCalendar').disabled=true;
};

$('goHome').onclick=()=>location.href='index.html';

</script>
</body>
</html>
