
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#245b91">
<title>German Learning AI – Schreiben</title>
<style>
:root{
  --window:#d4d0c8;--panel:#f2f1ed;--white:#fff;--ink:#202020;
  --blue:#245b91;--blue-dark:#153d68;--line:#9b9b9b;
  --soft:#e7edf4;--muted:#555;--green:#dff0df;--red:#f8e1df;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{background:#e9edf2;padding:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.window{
  width:min(1200px,100%);margin:0 auto;background:var(--window);
  border:1px solid #777;box-shadow:3px 3px 10px #0002;
}
.titlebar{
  background:linear-gradient(90deg,var(--blue-dark),#4383bb);
  color:#fff;padding:9px 12px;font-weight:bold;
  display:flex;align-items:center;justify-content:space-between;
}
.titlebar-title{font-size:15px}
.window-body{padding:12px}
.layout{
  display:grid;grid-template-columns:245px minmax(0,1fr);
  gap:12px;align-items:start;
}
.sidebar,.main-panel{
  background:var(--panel);border:1px solid #999;padding:12px;
  min-width:0;
}
.section-title{
  font-weight:bold;font-size:14px;margin:0 0 12px;
  padding-bottom:7px;border-bottom:1px solid #aaa;
}
.field{margin-bottom:12px}
.field label{
  display:block;font-size:13px;font-weight:bold;margin-bottom:5px;
}
.field select,.field input{
  width:100%;padding:7px;border:1px solid #888;background:#fff;
  min-height:34px;
}
.button-row{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.btn{
  border:1px solid #777;background:linear-gradient(#fff,#e2e2e2);
  padding:7px 12px;border-radius:2px;font-size:13px;
}
.btn:hover{background:linear-gradient(#fff,#d5e5f5)}
.btn.primary{
  color:#fff;background:linear-gradient(#397bb6,#245b91);
  border-color:#153d68;
}
.btn:disabled{opacity:.55;cursor:not-allowed}
.status{font-size:12px;color:#444;min-height:18px;margin-top:7px}
.main-panel{display:flex;flex-direction:column;gap:12px}
.content-box{
  border:1px solid #999;background:#fff;min-width:0;
}
.box-heading{
  background:#e3e3e3;border-bottom:1px solid #aaa;
  padding:8px 10px;font-weight:bold;font-size:14px;
}
.box-body{padding:12px;min-width:0}
.task-display{
  white-space:pre-wrap;overflow-wrap:anywhere;
  font-size:17px;line-height:1.75;min-height:100px;
}
.task-display:empty::before{
  content:"Aufgabe sẽ xuất hiện ở đây sau khi cậu tạo đề.";
  color:#777;
}
.answer-area{
  width:100%;min-height:220px;resize:vertical;
  border:1px solid #999;background:#fff;padding:12px;
  font-size:17px;line-height:1.75;outline:none;
}
.answer-area:focus{border-color:#397bb6;box-shadow:0 0 0 2px #397bb622}
#answer{
  width:100%;min-height:220px;resize:vertical;
  border:1px solid #999;background:#fff;padding:12px;
  font-size:17px;line-height:1.75;outline:none;
}
.result{
  white-space:pre-wrap;overflow-wrap:anywhere;
  font-size:16px;line-height:1.75;padding:13px 14px;
  min-height:80px;background:#fff;
}
.result:empty::before{
  content:"KI Korrektur sẽ xuất hiện ở đây sau khi chấm bài.";
  color:#777;
}
.correction-content .result{
  font-size:16px;line-height:1.75;padding:14px 16px;
}
.correction-content .result strong{font-weight:700}
.score-table{font-size:14px}
.score-note{font-size:12px;color:#555}
.info{font-size:12px;color:#555;line-height:1.5}
.loading{opacity:.65;pointer-events:none}
@media(max-width:760px){
  body{padding:5px}
  .layout{grid-template-columns:1fr}
  .sidebar{order:1}
  .main-panel{order:2}
  .task-display{font-size:16px;line-height:1.7}
  #answer,.answer-area{font-size:16px;line-height:1.7}
  .correction-content .result{font-size:15px;line-height:1.7}
  .score-table{font-size:13px}
}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="titlebar-title">Deutsch Lernen – Schreiben</div>
    <div>KI Schreibtrainer</div>
  </div>

  <div class="window-body">
    <div class="layout">
      <aside class="sidebar">
        <h3 class="section-title">Einstellungen</h3>

        <div class="field">
          <label for="topic">Thema</label>
          <select id="topic">
            <option value="Allgemein">Allgemein</option>
            <option value="Arbeit und Beruf">Arbeit und Beruf</option>
            <option value="Bildung und Lernen">Bildung und Lernen</option>
            <option value="Gesundheit">Gesundheit</option>
            <option value="Umwelt">Umwelt</option>
            <option value="Technologie">Technologie</option>
            <option value="Gesellschaft">Gesellschaft</option>
            <option value="Reisen und Verkehr">Reisen und Verkehr</option>
          </select>
        </div>

        <div class="field">
          <label for="level">Sprachniveau</label>
          <select id="level">
            <option value="B1">B1</option>
            <option value="B2" selected>B2</option>
            <option value="C1">C1</option>
          </select>
        </div>

        <div class="field">
          <label for="exam">Prüfung</label>
          <select id="exam">
            <option value="Goethe">Goethe</option>
            <option value="telc">telc</option>
            <option value="Allgemein">Allgemein</option>
          </select>
        </div>

        <div class="field">
          <label for="teil">Teil</label>
          <select id="teil">
            <option value="Teil 1">Teil 1</option>
            <option value="Teil 2">Teil 2</option>
          </select>
        </div>

        <div class="field">
          <label for="aufgabe">Aufgabe</label>
          <select id="aufgabe">
            <option value="Beschwerde">Beschwerde</option>
            <option value="Anfrage">Anfrage</option>
            <option value="Bitte">Bitte</option>
            <option value="Meinung äußern">Meinung äußern</option>
            <option value="Diskussionsbeitrag">Diskussionsbeitrag</option>
            <option value="Formelle E-Mail">Formelle E-Mail</option>
          </select>
        </div>

        <div class="button-row">
          <button class="btn primary" id="createTask">Neue Aufgabe</button>
        </div>

        <div class="button-row">
          <button class="btn" id="saveBtn">Speichern</button>
          <button class="btn" id="restoreBtn">Wiederherstellen</button>
          <button class="btn" id="clearBtn">Löschen</button>
        </div>

        <div class="status" id="status"></div>

        <p class="info">
          Wähle Thema, Niveau und Prüfungsformat aus.
          Klicke anschließend auf „Neue Aufgabe“, um eine
          Schreibaufgabe zu erhalten.
        </p>
      </aside>

      <main class="main-panel">
        <section class="content-box">
          <div class="box-heading">Aufgabe</div>
          <div class="box-body">
            <div class="task-display" id="task"></div>
            <div class="button-row">
              <button class="btn" id="copyTask">Aufgabe kopieren</button>
            </div>
          </div>
        </section>

        <section class="content-box">
          <div class="box-heading">Mein Text</div>
          <div class="box-body">
            <textarea id="answer" placeholder="Schreibe deinen Text hier..."></textarea>
            <div class="button-row">
              <button class="btn primary" id="gradeBtn">Text korrigieren</button>
              <button class="btn" id="copyAnswer">Text kopieren</button>
            </div>
          </div>
        </section>

        <section class="content-box correction-content">
          <div class="box-heading">KI Korrektur</div>
          <div class="box-body">
            <div class="result" id="correction"></div>
            <div class="button-row">
              <button class="btn" id="copyCorrection">Korrektur kopieren</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://german-schreiben-ai.xv-thanhduy.workers.dev";

const $ = (id) => document.getElementById(id);

let currentTask = "";
let currentCorrection = "";

function setStatus(message){
  $("status").textContent = message || "";
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function cleanCorrectionText(text){
  let result = String(text ?? "");

  result = result.replace(/\*\*/g, "");
  result = result.replace(/\|/g, " ");

  // Remove a duplicated section 7 if the Worker already returned it.
  const section7 = result.search(/7\.\s*ĐIỂM THEO TỪNG TIÊU CHÍ/i);
  if(section7 !== -1){
    const nextSection = result.indexOf("7.", section7 + 2);
    if(nextSection !== -1){
      result = result.slice(0, nextSection);
    }
  }

  return result.trim();
}

function renderCorrectionText(value){
  const headings = [
    /^1\.\s*NHẬN XÉT TỔNG QUAN\s*$/i,
    /^2\.\s*PHÂN TÍCH LỖI\s*$/i,
    /^3\.\s*TỪ VỰNG VÀ DIỄN ĐẠT\s*$/i,
    /^4\.\s*BỐ CỤC VÀ MẠCH LẠC\s*$/i,
    /^5\.\s*BÀI VIẾT HOÀN CHỈNH ĐÃ CHỈNH SỬA\s*$/i,
    /^6\.\s*ĐIỂM CẦN GHI NHỚ\s*$/i,
    /^7\.\s*ĐIỂM THEO TỪNG TIÊU CHÍ\s*$/i
  ];

  return String(value ?? "")
    .split("\n")
    .map(line => {
      const safeLine = escapeHTML(line);
      const isHeading = headings.some(pattern => pattern.test(line.trim()));
      return isHeading ? `<strong>${safeLine}</strong>` : safeLine;
    })
    .join("\n");
}

async function callWorker(payload){
  const response = await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });

  const data = await response.json().catch(() => ({}));

  if(!response.ok){
    throw new Error(data.error || data.message || `HTTP ${response.status}`);
  }

  return data;
}

async function createTask(){
  const button = $("createTask");
  button.disabled = true;
  setStatus("Aufgabe wird erstellt...");

  try{
    const payload = {
      action:"task",
      level:$("level").value,
      exam:$("exam").value,
      teil:$("teil").value,
      aufgabe:$("aufgabe").value,
      topic:$("topic").value
    };

    const data = await callWorker(payload);

    currentTask = data.task || data.prompt || data.reply || "";
    $("task").textContent = currentTask;

    currentCorrection = "";
    $("correction").innerHTML = "";

    setStatus("Neue Aufgabe wurde erstellt.");
  }catch(error){
    setStatus("Fehler: " + error.message);
  }finally{
    button.disabled = false;
  }
}

function buildEvaluationSection(data){
  if(!data || typeof data !== "object") return "";

  const evaluation = data.evaluation || data.criteria || data.scores;
  if(!evaluation) return "";

  if(typeof evaluation === "string"){
    return "\n\n7. ĐIỂM THEO TỪNG TIÊU CHÍ\n" + evaluation;
  }

  let lines = ["", "7. ĐIỂM THEO TỪNG TIÊU CHÍ"];

  if(Array.isArray(evaluation)){
    evaluation.forEach(item => {
      if(typeof item === "string"){
        lines.push("- " + item);
      }else if(item){
        const name = item.name || item.criterion || item.title || "";
        const score = item.score ?? item.points ?? "";
        const detail = item.feedback || item.comment || item.reason || "";

        lines.push(
          "- " + name +
          (score !== "" ? ": " + score : "") +
          (detail ? " – " + detail : "")
        );
      }
    });
  }else{
    Object.entries(evaluation).forEach(([key,value]) => {
      if(value && typeof value === "object"){
        const score = value.score ?? value.points ?? "";
        const detail = value.feedback || value.comment || "";
        lines.push(
          "- " + key +
          (score !== "" ? ": " + score : "") +
          (detail ? " – " + detail : "")
        );
      }else{
        lines.push("- " + key + ": " + value);
      }
    });
  }

  return lines.join("\n");
}

async function gradeAnswer(){
  const answer = $("answer").value.trim();

  if(!answer){
    setStatus("Bitte schreibe zuerst deinen Text.");
    $("answer").focus();
    return;
  }

  if(!currentTask){
    setStatus("Bitte erstelle zuerst eine Aufgabe.");
    return;
  }

  const button = $("gradeBtn");
  button.disabled = true;
  setStatus("Dein Text wird korrigiert...");

  try{
    const payload = {
      action:"grade",
      level:$("level").value,
      exam:$("exam").value,
      teil:$("teil").value,
      aufgabe:$("aufgabe").value,
      topic:$("topic").value,
      task:currentTask,
      answer:answer
    };

    const data = await callWorker(payload);

    let correction = data.correction || data.reply || data.result || "";

    correction = cleanCorrectionText(correction);

    // Add section 7 from structured evaluation data when available.
    if(data.evaluation || data.criteria || data.scores){
      if(!/7\.\s*ĐIỂM THEO TỪNG TIÊU CHÍ/i.test(correction)){
        correction += buildEvaluationSection(data);
      }
    }

    currentCorrection = correction;
    $("correction").innerHTML = renderCorrectionText(currentCorrection);

    setStatus("Korrektur abgeschlossen.");
  }catch(error){
    setStatus("Fehler: " + error.message);
  }finally{
    button.disabled = false;
  }
}

function saveState(){
  const state = {
    task:currentTask,
    answer:$("answer").value,
    correction:currentCorrection,
    topic:$("topic").value,
    level:$("level").value,
    exam:$("exam").value,
    teil:$("teil").value,
    aufgabe:$("aufgabe").value,
    savedAt:new Date().toISOString()
  };

  localStorage.setItem("schreibenPractice",JSON.stringify(state));
  setStatus("Deine Arbeit wurde gespeichert.");
}

function restoreState(){
  const raw = localStorage.getItem("schreibenPractice");

  if(!raw){
    setStatus("Keine gespeicherten Daten gefunden.");
    return;
  }

  try{
    const state = JSON.parse(raw);

    currentTask = state.task || "";
    currentCorrection = state.correction || "";

    $("task").textContent = currentTask;
    $("answer").value = state.answer || "";
    $("correction").innerHTML = renderCorrectionText(currentCorrection);

    if(state.topic) $("topic").value = state.topic;
    if(state.level) $("level").value = state.level;
    if(state.exam) $("exam").value = state.exam;
    if(state.teil) $("teil").value = state.teil;
    if(state.aufgabe) $("aufgabe").value = state.aufgabe;

    setStatus("Gespeicherte Arbeit wurde wiederhergestellt.");
  }catch(error){
    setStatus("Gespeicherte Daten konnten nicht geladen werden.");
  }
}

function clearAll(){
  if(!confirm("Möchtest du alle aktuellen Inhalte löschen?")) return;

  currentTask = "";
  currentCorrection = "";

  $("task").textContent = "";
  $("answer").value = "";
  $("correction").innerHTML = "";

  localStorage.removeItem("schreibenPractice");

  setStatus("Alle Inhalte wurden gelöscht.");
}

async function copyText(text,label){
  if(!text){
    setStatus("Es gibt keinen Inhalt zum Kopieren.");
    return;
  }

  try{
    await navigator.clipboard.writeText(text);
    setStatus(label + " wurde kopiert.");
  }catch(error){
    const textarea = document.createElement("textarea");
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    textarea.remove();
    setStatus(label + " wurde kopiert.");
  }
}

$("createTask").addEventListener("click",createTask);
$("gradeBtn").addEventListener("click",gradeAnswer);

$("saveBtn").addEventListener("click",saveState);
$("restoreBtn").addEventListener("click",restoreState);
$("clearBtn").addEventListener("click",clearAll);

$("copyTask").addEventListener("click",() => {
  copyText(currentTask,"Aufgabe");
});

$("copyAnswer").addEventListener("click",() => {
  copyText($("answer").value,"Mein Text");
});

$("copyCorrection").addEventListener("click",() => {
  copyText(currentCorrection,"KI Korrektur");
});

// Restore previously saved work when the page is opened.
(function(){
  const saved = localStorage.getItem("schreibenPractice");
  if(saved){
    restoreState();
  }
})();
</script>
</body>
</html>
