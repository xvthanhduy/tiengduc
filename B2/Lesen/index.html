<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Lesen B2</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 18px;
    min-height: 100vh;
    background:
        linear-gradient(
            rgba(5,12,25,0.78),
            rgba(5,12,25,0.88)
        ),
        url("./11.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #e5e7eb;
    font-family: Arial, Helvetica, sans-serif;
}

/* Khung Lesen nằm bên trái */
.container {
    position: relative;
    isolation: isolate;
    width: 100%;
    max-width: 850px;
    margin-left: 0;
    margin-right: auto;
}

/* Ánh sáng trắng nhẹ phía sau khung */
.container::before {
    content: "";
    position: absolute;
    z-index: -1;
    pointer-events: none;
    inset: -22px;

    background: radial-gradient(
        ellipse at 42% 35%,
        rgba(255,255,255,0.17) 0%,
        rgba(255,255,255,0.09) 42%,
        rgba(255,255,255,0.025) 72%,
        transparent 100%
    );

    filter: blur(30px);
}

header {
    text-align: center;
    margin-bottom: 28px;
}

header h1 {
    color: #60a5fa;
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    color: #cbd5e1;
}

.progress-area {
    margin-bottom: 20px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    color: #cbd5e1;
    font-size: 14px;
    margin-bottom: 9px;
}

.progress-bar {
    height: 8px;
    background: #263247;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #3b82f6;
    transition: width .3s;
}

.card {
    background: rgba(23,32,51,.96);
    border: 1px solid #40506a;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

.topic {
    color: #60a5fa;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.passage {
    color: #f1f5f9;
    font-size: 17px;
    line-height: 1.9;
    white-space: pre-wrap;
}

.passage-word {
    cursor: pointer;
    border-radius: 4px;
}

.passage-word:hover {
    background: #334b70;
    color: #93c5fd;
}

.hint {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 17px;
    font-style: italic;
}

.question {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 20px;
}

.choice {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border: 2px solid #344258;
    border-radius: 10px;
    background: #202d43;
    color: #e5e7eb;
    text-align: left;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
}

.choice:hover:not(:disabled) {
    border-color: #60a5fa;
    background: #263b59;
}

.choice:disabled {
    cursor: default;
    opacity: 1;
}

.choice.correct {
    border-color: #22c55e;
    background: #123c30;
    color: #bbf7d0;
}

.choice.wrong {
    border-color: #ef4444;
    background: #451f2a;
    color: #fecaca;
}

.feedback {
    display: none;
    padding: 16px;
    margin-top: 18px;
    border-radius: 12px;
    background: #202d43;
    border: 1px solid #3b4d68;
    line-height: 1.45;
}

.feedback h3 {
    margin: 0 0 12px;
}

.feedback p {
    margin: 7px 0;
}

.feedback-section {
    padding: 14px 16px;
    margin-top: 12px;
    border-radius: 10px;
    line-height: 1.45;
    white-space: normal;
}

.feedback-section h4 {
    margin: 0 0 9px;
    font-size: 16px;
}

.feedback-section p {
    margin: 6px 0;
}

.feedback-section-a {
    background: #15243a;
    border: 1px solid #41658e;
    border-left: 4px solid #60a5fa;
    color: #dbeafe;
}

.feedback-section-b {
    background: #192d35;
    border: 1px solid #38645b;
    border-left: 4px solid #34d399;
    color: #d1fae5;
}

.feedback-section-b p {
    margin: 6px 0;
    line-height: 1.5;
}

#other-answer {
    margin-top: 14px;
}

.feedback-label {
    font-weight: bold;
    color: #bfdbfe;
}

.evidence {
    padding: 10px 12px;
    margin: 8px 0 0;
    border-radius: 7px;
    background: rgba(96,165,250,.10);
    color: #bfdbfe;
    line-height: 1.45;
}

.explanation-line {
    margin: 6px 0;
}

.explanation-line strong {
    color: #a7f3d0;
}

@media(max-width:600px) {
    .feedback {
        padding: 12px;
    }
    .feedback-section {
        padding: 12px;
    }
}

.next-button,
.retry-button {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.next-button:hover,
.retry-button:hover {
    background: #1d4ed8;
}

.next-button:disabled {
    background: #475569;
    color: #94a3b8;
    cursor: not-allowed;
}

.result {
    display: none;
    text-align: center;
    padding: 35px 25px;
}

.result h2 {
    color: #60a5fa;
    font-size: 28px;
}

.score-number {
    font-size: 55px;
    font-weight: bold;
    color: #4ade80;
    margin: 20px 0;
}

.result-detail {
    font-size: 18px;
    line-height: 2;
    color: #cbd5e1;
}

/* Cửa sổ tra từ */
.word-popup {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.75);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.popup-content {
    width: 100%;
    max-width: 430px;
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
}

.popup-content h2 {
    color: #60a5fa;
    margin-top: 0;
    overflow-wrap: anywhere;
}

.word-meaning {
    font-size: 20px;
    color: #f8fafc;
    margin: 18px 0 10px;
}

.word-pos,
.word-plural {
    color: #cbd5e1;
    font-size: 14px;
    margin-top: 8px;
}

.word-status {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 12px;
}

.close-popup {
    margin-top: 22px;
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    background: #334155;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

@media(max-width:600px) {
    body {
        padding: 15px 10px;
    }

    .container {
        max-width: 100%;
    }

    .card {
        padding: 18px;
    }

    header h1 {
        font-size: 25px;
    }

    .passage {
        font-size: 16px;
    }

    .question {
        font-size: 17px;
    }
}


/* =========================================================
   WINDOWS 10 DARK MODE – giao diện בלבד, không thay đổi JS
   ========================================================= */
:root {
    color-scheme: dark;
    --win-bg: #080808;
    --win-surface: #1f1f1f;
    --win-surface-2: #252525;
    --win-surface-3: #2d2d2d;
    --win-border: #3b3b3b;
    --win-text: #f3f3f3;
    --win-muted: #bdbdbd;
    --win-blue: #0078d4;
    --win-blue-hover: #1683d8;
}

/* Giữ nền tối và ảnh nền 11.jpg đang có */
body {
    color: var(--win-text);
    background-color: var(--win-bg);
}

/* Tiêu đề theo phong cách ứng dụng Windows */
header {
    text-align: left;
    padding: 18px 20px;
    margin-bottom: 20px;
    background: rgba(31,31,31,.96);
    border: 1px solid var(--win-border);
    border-top: 3px solid var(--win-blue);
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
}

header h1 {
    color: #ffffff;
    font-size: 27px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: .2px;
}

header p {
    color: var(--win-muted);
    margin: 0;
}

/* Các khung nội dung chính */
.card {
    background: rgba(31,31,31,.97);
    border: 1px solid var(--win-border);
    border-radius: 5px;
    padding: 23px;
    box-shadow: 0 6px 20px rgba(0,0,0,.32);
}

.topic {
    color: #60b6ff;
    letter-spacing: .7px;
}

.passage {
    color: #eeeeee;
    line-height: 1.8;
}

.question {
    color: #ffffff;
}

/* Thanh tiến độ */
.progress-text {
    color: #d6d6d6;
}

.progress-bar {
    height: 7px;
    background: #303030;
    border: 1px solid #414141;
    border-radius: 2px;
}

.progress-fill {
    background: var(--win-blue);
}

/* Lựa chọn A/B */
.choice {
    background: #292929;
    color: #f1f1f1;
    border: 1px solid #505050;
    border-radius: 3px;
    transition: background .15s ease, border-color .15s ease;
}

.choice:hover:not(:disabled) {
    background: #343434;
    border-color: #60b6ff;
}

.choice.correct {
    background: #173b2a;
    border: 1px solid #2ea66a;
    color: #c8f7d8;
}

.choice.wrong {
    background: #482326;
    border: 1px solid #d95757;
    color: #ffd5d5;
}

/* Phản hồi và hai khung giải thích */
.feedback {
    background: #242424;
    border: 1px solid #484848;
    border-radius: 4px;
    padding: 17px;
    line-height: 1.5;
}

.feedback-section {
    border-radius: 3px;
    padding: 14px 16px;
    margin-top: 12px;
}

.feedback-section-a {
    background: #202a34;
    border: 1px solid #3d5368;
    border-left: 3px solid #0078d4;
    color: #e5edf5;
}

.feedback-section-b {
    background: #242b2b;
    border: 1px solid #465b58;
    border-left: 3px solid #299d78;
    color: #e3f1ed;
}

.feedback-section h4 {
    letter-spacing: .15px;
}

.evidence {
    background: #182735;
    border-left: 3px solid #60b6ff;
    border-radius: 2px;
    color: #d5eaff;
}

/* Nút hành động kiểu Windows */
.next-button,
.retry-button {
    background: var(--win-blue);
    border: 1px solid #1683d8;
    border-radius: 3px;
    color: #ffffff;
    transition: background .15s ease;
}

.next-button:hover:not(:disabled),
.retry-button:hover {
    background: var(--win-blue-hover);
}

.next-button:disabled {
    background: #3a3a3a;
    border-color: #505050;
    color: #999999;
}

/* Cửa sổ tra từ */
.word-popup {
    background: rgba(0,0,0,.78);
}

.popup-content {
    background: #202020;
    border: 1px solid #555555;
    border-top: 3px solid var(--win-blue);
    border-radius: 4px;
}

.popup-content h2 {
    color: #60b6ff;
}

.close-popup {
    background: #353535;
    border: 1px solid #555555;
    border-radius: 3px;
}

.close-popup:hover {
    background: #454545;
}

/* Khu vực kết quả */
.result h2 {
    color: #60b6ff;
}

.score-number {
    color: #4ade80;
}

/* Thanh cuộn tối, đồng bộ với giao diện */
* {
    scrollbar-color: #555555 #1c1c1c;
    scrollbar-width: thin;
}

@media(max-width:600px) {
    header {
        padding: 15px;
    }
    header h1 {
        font-size: 23px;
    }
    .card {
        padding: 17px;
    }
}

</style>
</head>

<body>

<div class="container">

<header>
    <h1>Deutsch Lesen B2</h1>
    <p>Luyện đọc hiểu tiếng Đức – Goethe B2</p>
</header>

<div id="quiz-area">

    <div class="progress-area">
        <div class="progress-text">
            <span id="progress-text"></span>
            <span id="score-text">Đúng: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="card">
        <div class="topic" id="topic"></div>
        <div class="passage" id="passage"></div>

        <div class="hint">
            💡 Bấm vào từ tiếng Đức để tra nghĩa, từ loại và số nhiều.
        </div>
    </div>

    <div class="card">

        <div class="question" id="question"></div>

        <button class="choice" id="choice-A"
            onclick="selectAnswer('A')"></button>

        <button class="choice" id="choice-B"
            onclick="selectAnswer('B')"></button>

        <div class="feedback" id="feedback">

            <h3 id="feedback-title"></h3>

            <section class="feedback-section feedback-section-a">
                <h4>📌 PHẦN A – ĐÁP ÁN VÀ DẪN CHỨNG</h4>
                <p id="correct-answer"></p>
                <div class="evidence">
                    <strong>📖 Dẫn chứng trong bài:</strong>
                    <div id="evidence-text"></div>
                </div>
            </section>

            <section class="feedback-section feedback-section-b">
                <h4>💡 PHẦN B – GIẢI THÍCH ĐÚNG / SAI</h4>
                <p id="explanation"><strong>Giải thích:</strong> </p>
                <p id="explanation-vi"><strong>Nghĩa tiếng Việt:</strong> </p>
                <p id="other-answer"></p>
                <p id="other-answer-vi"></p>
            </section>

        </div>

        <button class="next-button"
            id="next-button"
            onclick="nextQuestion()"
            disabled>
            Chọn đáp án trước nhé
        </button>

    </div>

</div>

<div class="card result" id="result">

    <h2>Hoàn thành bài Lesen B2!</h2>

    <p>Kết quả của cậu:</p>

    <div class="score-number" id="final-score"></div>

    <div class="result-detail" id="result-detail"></div>

    <button class="retry-button" onclick="startQuiz()">
        🔄 Làm lại 50 bài đọc
    </button>

</div>

</div>

<div class="word-popup" id="word-popup"
    onclick="closePopupOutside(event)">

    <div class="popup-content">

        <h2 id="popup-word"></h2>

        <div class="word-meaning" id="popup-meaning"></div>

        <div class="word-pos" id="popup-pos"></div>

        <div class="word-plural" id="popup-plural"></div>

        <div class="word-status" id="popup-status"></div>

        <button class="close-popup" onclick="closePopup()">
            Đóng
        </button>

    </div>

</div>

<script>
const allTasks = [
  {
    title: "Aufgabe 1 – Arbeiten im Homeoffice",
    text: `In vielen Unternehmen gehört das Arbeiten im Homeoffice inzwischen zum Alltag. Während einige Beschäftigte die größere Flexibilität schätzen, vermissen andere den direkten Austausch mit ihren Kollegen. Eine aktuelle Untersuchung zeigt, dass die Produktivität nicht automatisch steigt, wenn Mitarbeiter von zu Hause arbeiten. Entscheidend sind vielmehr klare Arbeitszeiten, eine geeignete technische Ausstattung und die Fähigkeit, Beruf und Privatleben voneinander zu trennen.

Besonders problematisch ist es, wenn Beschäftigte auch nach Feierabend ständig erreichbar sind. Dadurch kann die Grenze zwischen Arbeit und Freizeit zunehmend verschwimmen. Einige Unternehmen reagieren darauf, indem sie feste Zeiten für Besprechungen einführen und von ihren Mitarbeitern nicht erwarten, außerhalb der Arbeitszeit auf Nachrichten zu antworten.

Experten empfehlen außerdem, regelmäßige persönliche Treffen zu organisieren. Denn obwohl digitale Kommunikation viele Aufgaben erleichtert, kann sie das Vertrauen zwischen Kollegen nicht in jeder Situation vollständig ersetzen.`,
    question: "Welche Aussage entspricht dem Text?",
    a: "Homeoffice führt grundsätzlich zu einer höheren Produktivität.",
    b: "Klare Grenzen zwischen Arbeitszeit und Freizeit sind beim Homeoffice wichtig.",
    answer: "B",
    evidence: "Besonders problematisch ist es, wenn Beschäftigte auch nach Feierabend ständig erreichbar sind.",
    explanation: "Der Text betont, dass die Grenze zwischen Arbeit und Freizeit beim Homeoffice geschützt werden muss. Feste Arbeitszeiten helfen dabei.",
    explanation_vi: "Đoạn văn nhấn mạnh rằng khi làm việc tại nhà, cần giữ ranh giới rõ ràng giữa công việc và thời gian nghỉ ngơi. Giờ làm việc cố định giúp thực hiện điều đó.",
    wrong_reason: "A ist falsch, weil im Text ausdrücklich steht, dass die Produktivität nicht automatisch steigt, wenn man von zu Hause arbeitet.",
    wrong_reason_vi: "A sai vì đoạn văn nói rõ rằng năng suất không tự động tăng lên khi nhân viên làm việc tại nhà."
  },
  {
    title: "Aufgabe 2 – Nachhaltiger Tourismus",
    text: `Der Tourismus ist für viele Regionen eine wichtige Einnahmequelle. Gleichzeitig kann eine große Zahl von Besuchern erhebliche Belastungen verursachen. In beliebten Urlaubsorten steigen häufig die Mietpreise, während öffentliche Plätze und natürliche Landschaften zunehmend unter Druck geraten.

Einige Gemeinden versuchen deshalb, den Tourismus nachhaltiger zu gestalten. Sie fördern beispielsweise öffentliche Verkehrsmittel, begrenzen den Zugang zu besonders empfindlichen Naturgebieten oder unterstützen kleine Betriebe aus der Region. Ziel ist es nicht, Touristen grundsätzlich fernzuhalten, sondern die negativen Auswirkungen des Reisens zu reduzieren.

Auch Reisende können einen Beitrag leisten. Wer länger an einem Ort bleibt, regionale Produkte kauft und auf unnötige Autofahrten verzichtet, unterstützt die lokale Wirtschaft und schont gleichzeitig die Umwelt. Fachleute weisen jedoch darauf hin, dass nachhaltiger Tourismus nur funktioniert, wenn Gemeinden, Unternehmen und Urlauber gemeinsam Verantwortung übernehmen.`,
    question: "Was ist das Hauptziel nachhaltiger Tourismuskonzepte?",
    a: "Die negativen Folgen des Tourismus sollen verringert werden.",
    b: "Beliebte Urlaubsregionen sollen möglichst vollständig für Besucher gesperrt werden.",
    answer: "A",
    evidence: "Ziel ist es nicht, Touristen grundsätzlich fernzuhalten, sondern die negativen Auswirkungen des Reisens zu reduzieren.",
    explanation: "Nachhaltiger Tourismus bedeutet, die Umwelt und die lokale Bevölkerung zu schützen, ohne den Tourismus vollständig zu verhindern.",
    explanation_vi: "Du lịch bền vững có nghĩa là bảo vệ môi trường và người dân địa phương mà không ngăn cản hoàn toàn hoạt động du lịch.",
    wrong_reason: "B widerspricht dem Text. Die Gemeinden möchten Touristen nicht grundsätzlich ausschließen, sondern den Tourismus besser organisieren.",
    wrong_reason_vi: "B trái với nội dung bài đọc. Các địa phương không muốn loại trừ hoàn toàn khách du lịch, mà muốn tổ chức hoạt động du lịch hợp lý hơn."
  },
  {
    title: "Aufgabe 3 – Digitale Nachrichten",
    text: `Immer mehr Menschen informieren sich über aktuelle Ereignisse hauptsächlich über soziale Netzwerke. Nachrichten lassen sich dort schnell verbreiten und erreichen häufig auch Personen, die keine klassischen Nachrichtenmedien nutzen. Allerdings besteht die Gefahr, dass unvollständige oder falsche Informationen ebenso schnell verbreitet werden.

Ein weiteres Problem ist die Auswahl der Inhalte. Viele Plattformen zeigen ihren Nutzern vor allem Beiträge, die zu ihren bisherigen Interessen passen. Dadurch kann der Eindruck entstehen, dass die eigene Meinung von besonders vielen Menschen geteilt wird. Andere Perspektiven werden dagegen möglicherweise kaum wahrgenommen.

    question: "Warum kann die persönliche Nachrichten-Auswahl problematisch sein?",
    a: "Weil Nutzer dadurch möglicherweise weniger unterschiedliche Meinungen kennenlernen.",

    answer: "A",
    evidence: "Andere Perspektiven werden dagegen möglicherweise kaum wahrgenommen.",
    explanation: "Die Plattformen zeigen häufig Inhalte, die zu den bisherigen Interessen passen. Dadurch kann die Vielfalt der wahrgenommenen Meinungen eingeschränkt werden.",
    explanation_vi: "Các nền tảng thường hiển thị những nội dung phù hợp với sở thích trước đây của người dùng. Vì vậy, sự đa dạng trong các quan điểm mà họ tiếp nhận có thể bị hạn chế.",

    wrong_reason_vi: "B sai vì bài đọc nói rõ rằng tin tức có thể được lan truyền nhanh chóng qua mạng xã hội."

function getElement(...ids) {
  for (const id of ids) {
    const element = document.getElementById(id);
    if (element) return element;
  }
  return null;
}

function setText(element, value) {
  if (element) element.textContent = value;
}

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function renderPassage(text) {
  const passageElement = getElement(
    "passage-text",
    "passage",
    "reading-text"
  );

  if (!passageElement) {
    console.error("Không tìm thấy vùng hiển thị bài đọc.");
    return;
  }

  passageElement.innerHTML = "";

  const parts = text.split(/(\p{L}+(?:[-’'][\p{L}]+)*)/gu);

  parts.forEach(part => {
    if (/^\p{L}+(?:[-’'][\p{L}]+)*$/u.test(part)) {
      const span = document.createElement("span");
      span.className = "passage-word";
      span.textContent = part;
      span.dataset.word = part;
      span.title = "Bấm để tra nghĩa";
      span.addEventListener("click", () => lookupWord(part, span));
      passageElement.appendChild(span);
    } else {
      passageElement.appendChild(document.createTextNode(part));
    }
  });
}

function normalizeWord(word) {
  return word
    .toLowerCase()
    .replace(/[.,!?;:()[\]„“"»«]/g, "")
    .trim();
}

function findLocalWord(word) {
  const normalized = normalizeWord(word);

  if (vocabulary[normalized]) {
    return vocabulary[normalized];
  }

  // Thử tìm danh từ theo dạng có mạo từ
  for (const key of Object.keys(vocabulary)) {
    const keyWithoutArticle = key.replace(/^(der|die|das)\s+/i, "");

    if (keyWithoutArticle === normalized) {
      return vocabulary[key];
    }
  }

  return null;
}

async function lookupWord(word) {
  const popup = getElement("word-popup");
  if (!popup) return;

  popup.style.display = "flex";
  setText(getElement("popup-word"), word);
  setText(getElement("popup-meaning"), "Đang tra từ điển...");
  setText(getElement("popup-pos"), "");
  setText(getElement("popup-plural"), "");
  setText(getElement("popup-status"), "Vui lòng chờ một chút nhé.");

  const normalized = normalizeWord(word);
  const localResult = findLocalWord(normalized);

  if (localResult) {
    showWordResult(word, {
      meaning: localResult[0],
      type: localResult[1],
      plural: localResult[2] || "Không áp dụng"
    });
    return;
  }

  if (wordCache[normalized]) {
    showWordResult(word, wordCache[normalized]);
    return;
  }

  try {
    const result = await lookupOnline(word);
    wordCache[normalized] = result;

    try {
      localStorage.setItem("lesenB2_wordCache", JSON.stringify(wordCache));
    } catch (e) {}

    showWordResult(word, result);
  } catch (error) {
    setText(getElement("popup-meaning"), "Chưa tìm được nghĩa của từ này.");
    setText(getElement("popup-pos"), "Từ loại: Chưa xác định");
    setText(getElement("popup-plural"), "Số nhiều: Chưa xác định");
    setText(getElement("popup-status"), "Cậu hãy kiểm tra kết nối Internet nhé.");
  }
}

async function lookupOnline(word) {
  let meaning = "Chưa tìm thấy nghĩa tiếng Việt.";
  let type = "Chưa xác định";
  let plural = "Chưa xác định";

  try {
    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(word) +
      "&langpair=de|vi";

    const response = await fetch(url);
    if (!response.ok) throw new Error("Không thể tra bản dịch");
    const data = await response.json();
    const translation = data?.responseData?.translatedText;

    if (translation && !translation.toLowerCase().includes("mymemory warning")) {
      meaning = translation;
    }
  } catch (e) {}

  try {
    const url =
      "https://de.wiktionary.org/w/api.php?action=parse&page=" +
      encodeURIComponent(word) +
      "&prop=wikitext&format=json&origin=*";

    const response = await fetch(url);
    if (!response.ok) throw new Error("Không thể tra Wiktionary");
    const data = await response.json();
    const wikiText = data?.parse?.wikitext?.["*"] || "";

    if (/==\s*Substantiv\s*==/i.test(wikiText)) type = "Danh từ";
    else if (/==\s*Verb\s*==/i.test(wikiText)) type = "Động từ";
    else if (/==\s*Adjektiv\s*==/i.test(wikiText)) type = "Tính từ";
    else if (/==\s*Adverb\s*==/i.test(wikiText)) type = "Trạng từ";

    const pluralMatch = wikiText.match(/\|\s*Plural\s*=\s*([^\n|]+)/i);
    if (pluralMatch) plural = pluralMatch[1].trim();
  } catch (e) {}

  return { meaning, type, plural };
}

function showWordResult(word, result) {
  setText(getElement("popup-word"), word);
  setText(getElement("popup-meaning"), result.meaning || "Chưa tìm thấy nghĩa.");
  setText(getElement("popup-pos"), "Từ loại: " + (result.type || "Chưa xác định"));
  setText(getElement("popup-plural"), "Số nhiều: " + (result.plural || "Chưa xác định"));
  setText(getElement("popup-status"), "");
  const popup = getElement("word-popup");
  if (popup) popup.style.display = "flex";
}

function closeWordPopup() {
  const popup = getElement("word-popup");
  if (popup) popup.style.display = "none";
}

function closePopup() {
  closeWordPopup();
}

function closePopupOutside(event) {
  if (event.target && event.target.id === "word-popup") {
    closeWordPopup();
  }
}

document.addEventListener("click", event => {
  const popup = getElement("word-popup");

  if (
    popup &&
    !popup.contains(event.target) &&
    !event.target.classList.contains("passage-word")
  ) {
    closeWordPopup();
  }
});

// ==========================================
// 5. KHỞI ĐỘNG BÀI THI
// ==========================================

function startQuiz() {
  currentTasks = shuffle(allTasks);
  currentIndex = 0;
  score = 0;
  answered = false;

  const quizArea = getElement("quiz-area");
  const resultCard = getElement("result");

  if (quizArea) quizArea.style.display = "block";
  if (resultCard) resultCard.style.display = "none";

  showQuestion();
}

function showQuestion() {
  if (currentIndex >= currentTasks.length) {
    showResult();
    return;
  }

  answered = false;
  const task = currentTasks[currentIndex];

  setText(getElement("topic"), task.title);
  setText(getElement("question"), task.question);
  renderPassage(task.text);

  const optionA = getElement("choice-A");
  const optionB = getElement("choice-B");
  const feedback = getElement("feedback");
  const nextButton = getElement("next-button");

  setText(optionA, "A. " + task.a);
  setText(optionB, "B. " + task.b);

  [optionA, optionB].forEach(button => {
    if (!button) return;
    button.disabled = false;
    button.classList.remove("correct", "wrong");
  });

  if (feedback) {
    feedback.style.display = "none";
  }

  if (nextButton) {
    nextButton.disabled = true;
    nextButton.style.display = "block";
    nextButton.textContent = "Chọn đáp án trước nhé";
  }

  updateProgress();
}

// ==========================================
// 6. KIỂM TRA ĐÁP ÁN
// ==========================================

function selectAnswer(selected) {
  if (answered) return;

  const task = currentTasks[currentIndex];
  if (!task) return;

  answered = true;
  const correct = selected === task.answer;
  if (correct) score++;

  const optionA = getElement("choice-A");
  const optionB = getElement("choice-B");
  const selectedElement = selected === "A" ? optionA : optionB;
  const correctElement = task.answer === "A" ? optionA : optionB;

  if (optionA) optionA.disabled = true;
  if (optionB) optionB.disabled = true;

  if (correctElement) correctElement.classList.add("correct");
  if (!correct && selectedElement) selectedElement.classList.add("wrong");

  const feedback = getElement("feedback");
  setText(
    getElement("feedback-title"),
    correct ? "✓ Chính xác! Sehr gut!" : "✗ Chưa chính xác!"
  );
  const wrongAnswer = task.answer === "A" ? "B" : "A";
  const correctOptionText = task.answer === "A" ? task.a : task.b;
  setText(
    getElement("correct-answer"),
    "✓ Đáp án đúng: " + task.answer + ". " + correctOptionText
  );
  setText(getElement("evidence-text"), task.evidence);
  setText(
    getElement("explanation"),
    "Giải thích: " + task.explanation
  );
  setText(
    getElement("explanation-vi"),
    "Nghĩa tiếng Việt: " + (task.explanation_vi || "Chưa có bản dịch.")
  );
  setText(
    getElement("other-answer"),
    "✗ Đáp án " + wrongAnswer + " chưa đúng: " + task.wrong_reason
  );
  setText(
    getElement("other-answer-vi"),
    "Nghĩa tiếng Việt: " + (task.wrong_reason_vi || "Chưa có bản dịch.")
  );

  if (feedback) feedback.style.display = "block";

  const nextButton = getElement("next-button");
  if (nextButton) {
    nextButton.disabled = false;
    nextButton.textContent =
      currentIndex === currentTasks.length - 1
        ? "Xem kết quả"
        : "Câu tiếp theo →";
  }

  updateProgress();
}

// ==========================================
// 7. CÂU TIẾP THEO
// ==========================================

function nextQuestion() {
  if (!answered) return;

  currentIndex++;
  if (currentIndex < currentTasks.length) {
    showQuestion();
  } else {
    showResult();
  }
}

// ==========================================
// 8. THANH TIẾN ĐỘ
// ==========================================

function updateProgress() {
  const total = currentTasks.length || allTasks.length;
  const completed = answered ? currentIndex + 1 : currentIndex;

  const progressBar = getElement("progress-fill");
  const progressText = getElement("progress-text");
  const scoreText = getElement("score-text");

  if (progressBar) {
    progressBar.style.width = Math.round((completed / total) * 100) + "%";
  }

  setText(progressText, `Câu ${Math.min(currentIndex + 1, total)} / ${total}`);
  setText(scoreText, `Đúng: ${score}`);
}

// ==========================================
// 9. KẾT QUẢ CUỐI CÙNG
// ==========================================

function showResult() {
  const quizArea = getElement("quiz-area");
  const resultCard = getElement("result");
  if (quizArea) quizArea.style.display = "none";
  if (resultCard) resultCard.style.display = "block";

  const total = currentTasks.length;
  const percent = total ? Math.round((score / total) * 100) : 0;

  setText(getElement("final-score"), `${score}/${total} câu đúng – ${percent}%`);

  let message;
  if (percent >= 90) {
    message = "Xuất sắc! Cậu đã làm rất tốt trình độ B2.";
  } else if (percent >= 75) {
    message = "Rất tốt! Cậu đã nắm được phần lớn nội dung.";
  } else if (percent >= 60) {
    message = "Khá tốt! Cậu hãy tiếp tục luyện tập nhé.";
  } else if (percent >= 40) {
    message = "Cậu cần luyện thêm kỹ năng đọc hiểu và tìm bằng chứng.";
  } else {
    message = "Đừng nản nhé! Hãy đọc kỹ bài và thử làm lại.";
  }

  setText(getElement("result-detail"), message);
}

// Không gắn addEventListener cho các nút đáp án/chuyển câu:
// HTML đã gọi selectAnswer() và nextQuestion() bằng onclick.

startQuiz();
</script>
