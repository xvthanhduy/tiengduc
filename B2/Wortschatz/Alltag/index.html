<title>Wortschatz B2 – Alltag</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 16px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    background-color: #080f20;
    background-image:
        linear-gradient(rgba(8,15,32,0.12), rgba(8,15,32,0.12)),
        url("../../../11.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #f4f7ff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    position: relative;
    width: 100%;
    max-width: 650px;
    padding: 30px;
    border: 1px solid #24375b;
    border-radius: 22px;
    background: linear-gradient(145deg, #20365f, #142542);
    box-shadow: 0 18px 55px rgba(0,0,0,0.30), 0 0 22px rgba(117,160,255,.10);
    text-align: center;
}

/* BỐ CỤC KHUNG HỌC */
.quiz-layout {
    width: 100%;
    max-width: 650px;
    margin: 0 auto 0 0;
    display: block;
}

.container {
    width: 100%;
    max-width: 650px;
    padding-bottom: 66px;
}

/* BIỂU TƯỢNG ĐÈN TÍCH HỢP Ở GÓC DƯỚI BÊN PHẢI */
.lamp-toggle {
    position: absolute;
    right: 17px;
    bottom: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 68px;
    min-height: 38px;
    padding: 5px 9px;
    border: 1px solid rgba(157,184,245,.35);
    border-radius: 8px;
    background: rgba(26,43,75,.72);
    color: #aab9d5;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: color .25s ease, background .25s ease, box-shadow .25s ease, border-color .25s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.lamp-icon {
    display: inline-block;
    font-size: 21px;
    line-height: 1;
    filter: grayscale(1);
    opacity: .72;
    transition: filter .25s ease, opacity .25s ease, text-shadow .25s ease, transform .25s ease;
}

.lamp-toggle:hover {
    border-color: #8ab1ff;
    background: #243d68;
    color: #fff;
}

body.lamp-on .lamp-toggle {
    border-color: rgba(255,255,255,.8);
    background: rgba(237,242,248,.14);
    color: #fff;
    box-shadow: 0 0 12px rgba(255,255,255,.16);
}

body.lamp-on .lamp-icon {
    filter: none;
    opacity: 1;
    text-shadow: 0 0 7px #fff, 0 0 16px rgba(255,255,255,.95), 0 0 28px rgba(255,255,255,.65);
    transform: scale(1.08);
}

body.lamp-on .container {
    background: linear-gradient(145deg, #2b4778, #1b3156);
    border-color: rgba(220,235,255,.72);
    box-shadow:
        0 18px 55px rgba(0,0,0,.28),
        0 0 34px rgba(255,255,255,.30),
        0 0 72px rgba(190,215,255,.20);
}

/* GIAO DIỆN ĐIỆN THOẠI */

@media (max-width: 600px) {
    body {
        padding: 12px 8px;
        background-attachment: scroll;
    }

    .quiz-layout {
        gap: 8px;
        align-items: center;
    }

    .container {
        padding: 22px 12px;
        border-radius: 17px;
    }

    .container { padding-bottom: 62px; }

    .lamp-toggle {
        right: 10px;
        bottom: 9px;
        min-width: 62px;
        min-height: 35px;
        font-size: 12px;
    }

    .lamp-icon { font-size: 19px; }

    h1 { font-size: 21px; }
    .word { font-size: clamp(19px, 5vw, 25px); }
    .answers { grid-template-columns: 1fr; gap: 9px; }
    .answer { min-height: 56px; padding: 12px 8px; font-size: 14px; }
    .details { font-size: 12px; }
    .feedback { font-size: 14px; }
}

@media (max-width: 360px) {
    .container { padding-left: 9px; padding-right: 9px; }
}

h1 {

.word {

.speak-btn:hover {

.details {

    color: #9eacc7;
    font-size: 14px;

.answers {

.answer {

    background: #1a2b4b;

.answer:hover:not(:disabled) {

.answer:disabled {

.answer.correct {

}

.answer.wrong {
    border-color: #ff8995;

}

.feedback {

.navigation {

.result {

.score {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

// BẮT ĐẦU QUIZ

function startQuiz() {

    const count = Math.min(100, allWords.length);

    questions = shuffle(allWords).slice(0, count);

    current = 0;

    selectedAnswers = Array(questions.length).fill(null);

    optionsByQuestion = questions.map(q => {

        const wrongAnswers = allWords
            .filter(item => item.vi !== q.vi)
            .map(item => item.vi);

        const wrongAnswer =
            wrongAnswers[Math.floor(Math.random() * wrongAnswers.length)];

        return shuffle([
            { text: q.vi, correct: true },
            { text: wrongAnswer, correct: false }
        ]);
    });

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    showQuestion();
}

// HIỂN THỊ CÂU HỎI

function showQuestion() {

    if (current >= questions.length) {
        showResult();
        return;
    }

    const q = questions[current];

    currentOptions = optionsByQuestion[current];

    document.getElementById("progress").textContent =
        `Câu hỏi ${current + 1} / ${questions.length}`;

    document.getElementById("word").textContent = q.word;

    const details = [];

    if (q.plural) {
        details.push("Số nhiều: " + q.plural);
    }

    if (q.pos) {
        details.push("Giống: " + q.pos);
    }

    document.getElementById("details").textContent =
        details.join("  •  ");

    const buttons = [
        document.getElementById("optionA"),
        document.getElementById("optionB")
    ];

    buttons.forEach((button, index) => {

        button.textContent =
            (index === 0 ? "A. " : "B. ") +
            currentOptions[index].text;

        button.className = "answer";
        button.disabled = false;

        button.onclick = () => chooseAnswer(index);
    });

    const selected = selectedAnswers[current];

    const feedback = document.getElementById("feedback");

    feedback.textContent = "";
    feedback.style.color = "";

    if (selected !== null) {

        const correctIndex =
            currentOptions.findIndex(option => option.correct);

        buttons.forEach(button => button.disabled = true);

        if (currentOptions[selected].correct) {

            buttons[selected].classList.add("correct");

            feedback.textContent = "✓ Correct! Sehr gut!";
            feedback.style.color = "#38d996";

        } else {

            buttons[selected].classList.add("wrong");

            buttons[correctIndex].classList.add("correct");

            feedback.textContent =
                "✗ Incorrect! Đáp án đúng: " +
                currentOptions[correctIndex].text;

            feedback.style.color = "#ff8995";
        }
    }

    document.getElementById("prev-button").disabled =
        current === 0;
}

// CHỌN ĐÁP ÁN

function chooseAnswer(index) {

    if (selectedAnswers[current] !== null) return;

    selectedAnswers[current] = index;

    // Đọc từ tiếng Đức sau khi chọn đáp án
    speakWord();

    showQuestion();
}

// CHUYỂN CÂU HỎI

function previousQuestion() {

    if (current <= 0) return;

    current--;

    showQuestion();
}

function nextQuestion() {

    if (current < questions.length - 1) {

        current++;

        showQuestion();

    } else {

        showResult();
    }
}

// KẾT QUẢ

function showResult() {

    const points = selectedAnswers.reduce(
        (total, selected, index) => {

            return total +
                (selected !== null &&
                optionsByQuestion[index][selected].correct ? 1 : 0);

        }, 0
    );

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `Kết quả: ${points} / ${questions.length} câu đúng`;
}

// PHÁT ÂM TIẾNG ĐỨC

let pendingGermanWord = "";
let voiceCheckTimer = null;

// Chọn giọng tiếng Đức

function findGermanVoice() {

    const voices = window.speechSynthesis.getVoices();

    return voices.find(v =>
        v.lang.toLowerCase() === "de-de"
    )
    || voices.find(v =>
        v.lang.toLowerCase().startsWith("de-")
    )
    || voices.find(v =>
        v.lang.toLowerCase() === "de"
    );
}

// Chuyển s/r/e thành das/der/die

function expandGermanArticle(word) {

    return word
        .replace(/^s\s+/i, "das ")
        .replace(/^r\s+/i, "der ")
        .replace(/^e\s+/i, "die ");
}

// Phát âm từ

function playGermanWord(word, voice) {

    const synth = window.speechSynthesis;

    synth.cancel();

    const utterance = new SpeechSynthesisUtterance(word);

    utterance.voice = voice;
    utterance.lang = voice.lang;
    utterance.rate = 0.85;
    utterance.pitch = 1;

    synth.speak(utterance);
}

// Kiểm tra giọng đọc đã sẵn sàng chưa

function tryPlayPendingGermanWord() {

    if (!pendingGermanWord) return false;

    const voice = findGermanVoice();

    if (!voice) return false;

    const word = pendingGermanWord;

    pendingGermanWord = "";

    if (voiceCheckTimer) {
        clearTimeout(voiceCheckTimer);
        voiceCheckTimer = null;
    }

    playGermanWord(word, voice);

    return true;
}

// Hàm phát âm chính

function speakWord() {

    const originalWord =
        document.getElementById("word").textContent.trim();

    if (!originalWord) return;

    if (!("speechSynthesis" in window)) {

        document.getElementById("feedback").textContent =
            "Trình duyệt này không hỗ trợ phát âm tự động.";

        document.getElementById("feedback").style.color =
            "#ff8995";

        return;
    }

    // Chuyển mạo từ viết tắt thành dạng đầy đủ
    const wordToSpeak = expandGermanArticle(originalWord);

    const synth = window.speechSynthesis;

    synth.cancel();

    pendingGermanWord = wordToSpeak;

    // Thử phát âm ngay
    if (tryPlayPendingGermanWord()) return;

    // Chờ trình duyệt tải danh sách giọng đọc
    synth.onvoiceschanged = function() {
        tryPlayPendingGermanWord();
    };

    if (voiceCheckTimer) {
        clearTimeout(voiceCheckTimer);
    }

    voiceCheckTimer = window.setTimeout(() => {

        if (!tryPlayPendingGermanWord() && pendingGermanWord) {

            pendingGermanWord = "";

            document.getElementById("feedback").textContent =
                "Thiết bị chưa có giọng đọc tiếng Đức. Hãy tải giọng German trong cài đặt thiết bị.";

            document.getElementById("feedback").style.color =
                "#ff8995";
        }

    }, 1800);
}

// Khởi tạo danh sách giọng đọc

if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
}

// ĐIỀU KHIỂN ĐÈN LAMPE

function toggleLamp() {
    const isOn = document.body.classList.toggle("lamp-on");
    const lampButton = document.getElementById("lampToggle");

    lampButton.setAttribute("aria-pressed", String(isOn));
    lampButton.setAttribute("aria-label", isOn ? "Tắt đèn" : "Bật đèn");
    lampButton.title = isOn ? "Tắt đèn" : "Bật đèn";
}

// KHỞI CHẠY QUIZ

startQuiz();

</script>
