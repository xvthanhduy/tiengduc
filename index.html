
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch-Lernen B2</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#website {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* TRINH PHAT NHAC MINI */
.music-player {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;
    width: 320px;
    padding: 14px;
    color: white;
    background: rgba(20, 25, 30, 0.92);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

.player-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.player-heading strong {
    font-size: 13px;
}

#status {
    font-size: 11px;
    color: #a8edbd;
}

#youtubePlayer {
    width: 100%;
    height: 200px;
    background: #111;
    border-radius: 9px;
    overflow: hidden;
}

.track-name {
    margin-top: 10px;
    font-size: 13px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 10px 0;
}

.controls button {
    border: none;
    background: transparent;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.controls button:hover {
    color: #a8edbd;
}

.controls .play-button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
}

.volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
}

.volume-row input {
    flex: 1;
    accent-color: #75d69a;
    cursor: pointer;
}

.player-footer {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 12px;
}

.player-footer button {
    border: none;
    background: transparent;
    color: white;
    font-size: 11px;
    cursor: pointer;
}

.player-footer button:hover {
    color: #a8edbd;
}

.playlist {
    display: none;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.2);
    max-height: 130px;
    overflow-y: auto;
}

.playlist.show {
    display: block;
}

.playlist button {
    display: block;
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: white;
    text-align: left;
    font-size: 12px;
    cursor: pointer;
}

.playlist button:hover,
.playlist button.active {
    background: rgba(255,255,255,0.18);
}

@media (max-width: 600px) {
    .music-player {
        width: calc(100% - 24px);
        right: 12px;
        bottom: 12px;
    }
}
</style>
</head>

<body>

<!-- NOI DUNG WEBSITE -->
<iframe
    id="website"
    src="home.html"
    title="Deutsch-Lernen B2">
</iframe>

<!-- TRINH PHAT YOUTUBE -->
<div class="music-player">

    <div class="player-heading">
        <strong>♫ Deutsch-Lernen Music</strong>
        <span id="status">Sẵn sàng</span>
    </div>

    <!-- YouTube se hien thi video tai day -->
    <div id="youtubePlayer"></div>

    <div class="track-name" id="trackName">
        Bài hát số 1
    </div>

    <div class="controls">

        <button onclick="previousTrack()" title="Bài trước">
            ⏮
        </button>

        <button
            class="play-button"
            id="playButton"
            onclick="togglePlay()"
            title="Phát hoặc tạm dừng">
            ▶
        </button>

        <button onclick="nextTrack()" title="Bài tiếp theo">
            ⏭
        </button>

    </div>

    <div class="volume-row">
        <span>🔊</span>

        <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="35">
    </div>

    <div class="player-footer">
        <button onclick="togglePlaylist()">
            ☷ Danh sách nhạc
        </button>

        <button id="repeatButton" onclick="toggleRepeat()">
            ↻ Lặp: Bật
        </button>
    </div>

    <div class="playlist" id="playlist"></div>

</div>

<script>

// ======================================
// DANH SACH 3 VIDEO YOUTUBE CUA CẬU
// ======================================

const tracks = [
    {
        id: "L1IPbx28wAM",
        name: "Bài hát 1"
    },
    {
        id: "jc7Q1X0LeyY",
        name: "Bài hát 2"
    },
    {
        id: "dNPl-QqqJ6w",
        name: "Bài hát 3"
    }
];

let currentTrack = 0;
let repeatPlaylist = true;
let player = null;
let playerReady = false;

const playButton = document.getElementById("playButton");
const trackName = document.getElementById("trackName");
const statusText = document.getElementById("status");
const playlist = document.getElementById("playlist");
const volume = document.getElementById("volume");

// ======================================
// TAO DANH SACH NHAC
// ======================================

function renderPlaylist() {

    playlist.innerHTML = "";

    tracks.forEach((track, index) => {

        const button = document.createElement("button");

        button.textContent =
            (index + 1) + ". " + track.name;

        if (index === currentTrack) {
            button.classList.add("active");
        }

        button.onclick = function() {
            loadTrack(index);
        };

        playlist.appendChild(button);
    });
}

// ======================================
// CAP NHAT TEN BAI HAT
// ======================================

function updateTrackName() {

    trackName.textContent =
        tracks[currentTrack].name;

    if (playerReady) {

        const videoInfo = player.getVideoData();

        if (videoInfo && videoInfo.title) {
            trackName.textContent = videoInfo.title;
        }
    }

    renderPlaylist();
}

// ======================================
// KHOI TAO YOUTUBE PLAYER
// ======================================

function onYouTubeIframeAPIReady() {

    player = new YT.Player("youtubePlayer", {

        width: "100%",
        height: "200",

        videoId: tracks[0].id,

        playerVars: {
            autoplay: 0,
            controls: 1,
            playsinline: 1,
            rel: 0
        },

        events: {

            onReady: function(event) {

                playerReady = true;

                event.target.setVolume(
                    Number(volume.value)
                );

                statusText.textContent = "Sẵn sàng";

                updateTrackName();
            },

            onStateChange: onPlayerStateChange,

            onError: function(event) {

                statusText.textContent =
                    "Video không phát được";

                console.log(
                    "Lỗi YouTube:",
                    event.data
                );
            }
        }
    });
}

// ======================================
// THEO DOI TRANG THAI VIDEO
// ======================================

function onPlayerStateChange(event) {

    // 1 = Dang phat
    if (event.data === 1) {

        playButton.textContent = "Ⅱ";

        statusText.textContent = "Đang phát";

        updateTrackName();
    }

    // 2 = Tam dung
    else if (event.data === 2) {

        playButton.textContent = "▶";

        statusText.textContent = "Đã tạm dừng";
    }

    // 0 = Video da ket thuc
    else if (event.data === 0) {

        if (
            repeatPlaylist ||
            currentTrack < tracks.length - 1
        ) {
            nextTrack();
        } else {

            playButton.textContent = "▶";

            statusText.textContent =
                "Đã hết danh sách";
        }
    }
}

// ======================================
// PHAT / TAM DUNG
// ======================================

function togglePlay() {

    if (!playerReady) {

        statusText.textContent =
            "Đang tải YouTube...";

        return;
    }

    const state = player.getPlayerState();

    if (state === 1) {

        player.pauseVideo();

    } else {

        player.playVideo();
    }
}

// ======================================
// CHON BAI HAT
// ======================================

function loadTrack(index) {

    if (!playerReady) return;

    currentTrack = index;

    updateTrackName();

    statusText.textContent = "Đang tải bài hát";

    player.loadVideoById(
        tracks[currentTrack].id
    );
}

// ======================================
// BAI TIEP THEO
// ======================================

function nextTrack() {

    let next = currentTrack + 1;

    if (next >= tracks.length) {
        next = 0;
    }

    loadTrack(next);
}

// ======================================
// BAI TRUOC
// ======================================

function previousTrack() {

    let previous = currentTrack - 1;

    if (previous < 0) {
        previous = tracks.length - 1;
    }

    loadTrack(previous);
}

// ======================================
// DIEU CHINH AM LUONG
// ======================================

volume.addEventListener("input", function() {

    if (playerReady) {

        player.setVolume(
            Number(volume.value)
        );
    }
});

// ======================================
// HIEN / AN PLAYLIST
// ======================================

function togglePlaylist() {

    playlist.classList.toggle("show");
}

// ======================================
// BAT / TAT LAP PLAYLIST
// ======================================

function toggleRepeat() {

    repeatPlaylist = !repeatPlaylist;

    document.getElementById("repeatButton").textContent =
        repeatPlaylist
            ? "↻ Lặp: Bật"
            : "↻ Lặp: Tắt";
}

// ======================================
// TAI YOUTUBE IFRAME API
// ======================================

const youtubeScript = document.createElement("script");

youtubeScript.src =
    "https://www.youtube.com/iframe_api";

document.head.appendChild(youtubeScript);

// ======================================
// KHOI TAO PLAYLIST
// ======================================

renderPlaylist();

</script>

</body>
</html>
