
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch-Lernen B2</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #101b1c;
}

/* =========================================
   WEBSITE
========================================= */

#website {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* =========================================
   GLASS WINDOWS MUSIC PLAYER
========================================= */

.music-player {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 9999;

    width: 350px;

    color: #f4fff8;

    background:
        linear-gradient(
            135deg,
            rgba(28, 54, 49, 0.88),
            rgba(15, 31, 34, 0.91)
        );

    border: 1px solid rgba(179, 255, 211, 0.25);
    border-radius: 17px;

    box-shadow:
        0 18px 55px rgba(0, 0, 0, 0.38),
        0 0 25px rgba(87, 220, 145, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.13);

    backdrop-filter: blur(28px) saturate(150%);
    -webkit-backdrop-filter: blur(28px) saturate(150%);

    overflow: hidden;

    transition:
        width 0.25s ease,
        transform 0.25s ease,
        opacity 0.25s ease;
}

/* =========================================
   WINDOWS TITLE BAR
========================================= */

.title-bar {
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding-left: 14px;

    background: rgba(255,255,255,0.055);

    border-bottom: 1px solid rgba(255,255,255,0.10);

    user-select: none;
}

.title-left {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
}

.title-icon {
    color: #8FF0B2;
    font-size: 18px;

    text-shadow:
        0 0 12px rgba(114,255,168,0.5);
}

.window-controls {
    display: flex;
    height: 100%;
}

.window-controls button {
    width: 40px;
    height: 100%;

    border: none;
    background: transparent;

    color: rgba(255,255,255,0.9);
    font-family: "Segoe UI", sans-serif;
    font-size: 14px;

    cursor: pointer;
    transition: background 0.15s;
}

.window-controls button:hover {
    background: rgba(255,255,255,0.14);
}

.window-controls .close-button:hover {
    background: #C42B1C;
    color: white;
}

/* =========================================
   PLAYER CONTENT
========================================= */

.player-content {
    padding: 14px;
}

#youtubePlayer {
    width: 100%;
    height: 200px;
    min-width: 200px;
    min-height: 200px;

    overflow: hidden;
    border-radius: 11px;

    background: #080808;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.25);
}

.track-name {
    margin-top: 13px;
    margin-bottom: 5px;

    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;

    overflow-wrap: anywhere;
}

.player-status {
    color: #9BE8B5;
    font-size: 10px;
    margin-top: 5px;
}

/* =========================================
   MUSIC CONTROLS
========================================= */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;

    margin: 13px 0;
}

.controls button {
    border: none;
    background: transparent;

    color: #f4fff8;
    font-size: 20px;

    cursor: pointer;
    transition: 0.2s;
}

.controls button:hover {
    color: #91F2B5;
    transform: scale(1.12);

    text-shadow:
        0 0 12px rgba(122,255,173,0.4);
}

.controls .play-button {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            rgba(130, 242, 174, 0.30),
            rgba(67, 170, 117, 0.20)
        );

    border: 1px solid rgba(174,255,203,0.25);

    font-size: 19px;

    box-shadow:
        0 0 18px rgba(105,235,155,0.10);
}

/* =========================================
   VOLUME
========================================= */

.volume-row {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 13px;
}

.volume-row input {
    flex: 1;
    accent-color: #8CE9AA;
    cursor: pointer;
}

/* =========================================
   FOOTER
========================================= */

.player-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 14px;
}

.player-footer button {
    border: none;
    background: transparent;

    color: rgba(255,255,255,0.85);
    font-size: 11px;

    cursor: pointer;
}

.player-footer button:hover {
    color: #9CF4BA;
}

/* =========================================
   PLAYLIST
========================================= */

.playlist {
    display: none;

    margin-top: 12px;
    padding-top: 9px;

    border-top: 1px solid rgba(255,255,255,0.13);

    max-height: 135px;
    overflow-y: auto;
}

.playlist.show {
    display: block;
}

.playlist button {
    display: block;
    width: 100%;

    padding: 10px;

    border: 1px solid transparent;
    border-radius: 8px;

    background: transparent;
    color: white;

    font-size: 12px;
    text-align: left;

    cursor: pointer;
    transition: 0.2s;
}

.playlist button:hover,
.playlist button.active {
    background: rgba(133, 232, 170, 0.13);
    border-color: rgba(144, 241, 177, 0.15);
}

/* =========================================
   MINIMIZED WINDOW
========================================= */

.music-player.minimized {
    width: 285px;
}

.music-player.minimized #youtubePlayer,
.music-player.minimized .track-name,
.music-player.minimized .volume-row,
.music-player.minimized .player-footer,
.music-player.minimized .player-status,
.music-player.minimized .playlist {
    display: none;
}

.music-player.minimized .player-content {
    padding: 8px 12px 12px;
}

.music-player.minimized .controls {
    margin: 0;
    gap: 25px;
}

.music-player.minimized .controls button {
    font-size: 18px;
}

.music-player.minimized .controls .play-button {
    width: 37px;
    height: 37px;
}

/* =========================================
   MAXIMIZED WINDOW
========================================= */

.music-player.maximized {
    width: min(650px, calc(100vw - 32px));

    right: 50%;
    bottom: 50%;

    transform: translate(50%, 50%);
}

.music-player.maximized #youtubePlayer {
    height: 300px;
}

.music-player.maximized .player-content {
    padding: 20px;
}

/* =========================================
   HIDDEN PLAYER / FLOATING BUTTON
========================================= */

.restore-button {
    position: fixed;
    right: 25px;
    bottom: 25px;

    z-index: 10000;

    width: 54px;
    height: 54px;

    border: 1px solid rgba(180,255,211,0.28);
    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(35,75,59,0.94),
            rgba(16,39,39,0.96)
        );

    color: #9CF2B7;
    font-size: 24px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30),
        0 0 18px rgba(100,240,155,0.15);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    cursor: pointer;

    display: none;

    transition: 0.2s;
}

.restore-button:hover {
    transform: scale(1.08);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30),
        0 0 25px rgba(100,240,155,0.30);
}

.restore-button.show {
    display: block;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .music-player {
        right: 12px;
        bottom: 12px;

        width: calc(100% - 24px);
    }

    .music-player.minimized {
        width: min(285px, calc(100vw - 24px));
    }

    .music-player.maximized {
        width: calc(100vw - 24px);
    }

    .music-player.maximized #youtubePlayer {
        height: 220px;
    }

    .restore-button {
        right: 15px;
        bottom: 15px;
    }
}

/* =========================================
   MOBILE FIX: WINDOW CONTROLS + VOLUME
   Giữ nguyên giao diện desktop.
========================================= */

.title-bar {
    display: flex;
    min-width: 0;
}

.title-left {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
}

.title-left span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.window-controls {
    display: flex !important;
    flex: 0 0 auto;
    flex-shrink: 0;
    margin-left: 6px;
    position: relative;
    z-index: 5;
}

.window-controls button {
    flex: 0 0 40px;
    min-width: 0;
    touch-action: manipulation;
}

.volume-row {
    position: relative;
    z-index: 2;
    min-width: 0;
}

.volume-row input[type="range"] {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    height: 28px;
    margin: 0;
    padding: 0;
    touch-action: pan-x;
    pointer-events: auto;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
}

.volume-row input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 99px;
    background: #697386;
}

.volume-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -6px;
    border-radius: 50%;
    background: #60a5fa;
    border: 2px solid #eaf2ff;
}

.volume-row input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 99px;
    background: #697386;
}

.volume-row input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #60a5fa;
    border: 2px solid #eaf2ff;
}

@media (max-width: 600px) {
    .title-bar {
        height: 44px;
        padding-left: 10px;
    }

    .title-left {
        gap: 6px;
        font-size: 11px;
    }

    .window-controls {
        visibility: visible !important;
        opacity: 1 !important;
    }

    .window-controls button {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 34px;
        flex-basis: 34px;
        height: 44px;
        font-size: 13px;
    }

    .volume-row {
        gap: 9px;
        padding: 3px 0;
    }

    .volume-row input[type="range"] {
        min-height: 32px;
    }
}


/* =========================================
   COMPACT PLAYER: small screens / short windows
   Giữ thanh tiêu đề và 3 nút cửa sổ luôn nhìn thấy.
========================================= */

    width: 320px;
    max-width: calc(100vw - 20px);
}

.music-player #youtubePlayer {
    height: 170px;
}

.music-player .player-content {
    padding: 12px;
}

.title-bar {
    min-height: 42px;
    height: 42px;
}

.window-controls {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    flex: 0 0 auto;
}

.window-controls button {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    width: 34px;
    flex: 0 0 34px;
    height: 42px;
    padding: 0;
}

/* Cửa sổ có chiều cao thấp: thu gọn nội dung, không ẩn title bar */

    }

    }
    .music-player .track-name {

        font-size: 13px;
    }
    .music-player .controls {

        gap: 18px;
    }
    .music-player .controls .play-button {

        height: 40px;
    }
    .music-player .player-footer {

    }
}

@media (max-width: 600px) {
    .music-player,
    .music-player.maximized {
        right: 10px;
        bottom: 10px;
        left: 10px;
        width: auto;
        max-width: none;
        max-height: calc(100dvh - 20px);
        overflow-y: auto;
    }

    .music-player #youtubePlayer {
        height: 150px;
    }

    .music-player.maximized #youtubePlayer {
        height: 180px;
    }

    .title-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(35, 40, 53, .98);
    }

    .title-left {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 10px;
    }

    .window-controls button {
        width: 32px;
        flex-basis: 32px;
        height: 42px;
    }

    .volume-row input[type="range"] {
        min-width: 0;
        width: 100%;
        min-height: 38px;
        touch-action: pan-y;
        cursor: pointer;
    }
}

@media (max-width: 380px) {
    .title-left span:last-child {
        max-width: 90px;
    }
    .window-controls button {
        width: 29px;
        flex-basis: 29px;
        font-size: 12px;
    }
}


/* =========================================
   DEUTSCH AI — MINIMAL UI, persistent parent shell
========================================= */
.ai-mini {
    position: fixed; left: 25px; right: auto; bottom: 25px; z-index: 10001;
    width: 350px; height: 490px; max-height: min(72vh, 650px);
    display: flex; flex-direction: column; overflow: hidden;
    color: #202124; background: #ffffff;
    border: 1px solid #e5e7eb; border-radius: 16px;
    box-shadow: 0 12px 36px rgba(20, 25, 35, .16);
    transition: height .22s ease, width .22s ease, opacity .2s ease;
}
.ai-mini.ai-left { right: auto; left: 25px; }
.ai-head {
    min-height: 54px; display:flex; align-items:center; justify-content:space-between;
    padding: 0 12px 0 16px; background:#fff;
    border-bottom:1px solid #eef0f2; cursor:move; user-select:none;
}
.ai-brand { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:650; color:#202124; }
.ai-brand-mark {
    width:30px; height:30px; display:grid; place-items:center; border-radius:10px;
    color:#fff; background:#252a31; font-size:14px; font-weight:700;
}
.ai-brand-copy { display:flex; flex-direction:column; gap:2px; }
.ai-brand-copy small { color:#8a9099; font-size:10px; font-weight:400; }
.ai-window-controls { display:flex; gap:3px; }
.ai-window-controls button {
    width:29px; height:29px; border:0; border-radius:8px;
    color:#626873; background:transparent; cursor:pointer; font-size:15px;
}
.ai-window-controls button:hover { background:#f1f2f4; color:#202124; }
.ai-window-controls .ai-close:hover { background:#fff0f0; color:#c43d3d; }
.ai-content { flex:1; min-height:0; display:flex; flex-direction:column; background:#fff; }
.ai-messages {
    flex:1; min-height:0; overflow:auto; padding:10px 12px 14px;
    display:flex; flex-direction:column; gap:9px;
}
.ai-msg {
    max-width:90%; padding:9px 11px; border-radius:12px; font-size:12.5px;
    line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere;

/* =========================================
   ONE-TIME CROSS-SCREEN LIGHT SWEEP
   Tia dọc chạy trái -> phải; tia ngang chạy trên -> dưới.
========================================= */
.screen-light-sweep {
    position: fixed;
    inset: 0;
    z-index: 9998;
    overflow: hidden;
    pointer-events: none;
}
.screen-light-sweep::before,
.screen-light-sweep::after {
    content: "";
    position: absolute;
    display: block;
    opacity: 0;
    filter: blur(1.5px);
    box-shadow: 0 0 12px rgba(255,255,255,.78), 0 0 28px rgba(255,255,255,.4);
}
/* Đường sáng ngang: di chuyển theo chiều dọc, từ trên xuống dưới. */
.screen-light-sweep::before {
    left: 50%;
    top: -100%;
    width: 100%;
    height: 2px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.98), transparent);
    animation: horizontal-line-top-to-bottom 4.2s ease-in-out .15s 1 forwards;
}
/* Đường sáng dọc: di chuyển theo chiều ngang, từ trái sang phải. */
.screen-light-sweep::after {
    left: -100%;
    top: 50%;
    width: 2px;
    height: 100%;
    transform: translateY(-50%);
    background: linear-gradient(180deg, transparent, rgba(255,255,255,.98), transparent);
    animation: vertical-line-left-to-right 4.2s ease-in-out .15s 1 forwards;
}
@keyframes horizontal-line-top-to-bottom {
    0% { top: -100%; opacity: 0; }
    18% { opacity: .95; }
    82% { opacity: .85; }
    100% { top: 100%; opacity: 0; }
}
@keyframes vertical-line-left-to-right {
    0% { left: -100%; opacity: 0; }
    18% { opacity: .95; }
    82% { opacity: .85; }
    100% { left: 100%; opacity: 0; }
}

<script>

// ======================================
// 1. YOUTUBE PLAYLIST
// ======================================

const tracks = [

    {
        id: "L1IPbx28wAM",
        name: "Bài hát 1"
    },

    {
        id: "jc7Q1X0LeyY",
        name: "Bài hát 2"
    },

    {
        id: "dNPl-QqqJ6w",
        name: "Bài hát 3"
    }

];


// ======================================
// 2. PLAYER VARIABLES
// ======================================

let currentTrack = 0;

let repeatPlaylist = true;

let player = null;

let playerReady = false;

const musicPlayer =
    document.getElementById("musicPlayer");

const restoreButton =
    document.getElementById("restoreButton");

const playButton =
    document.getElementById("playButton");

const trackName =
    document.getElementById("trackName");

const statusText =
    document.getElementById("status");

const playlist =
    document.getElementById("playlist");

const volume =
    document.getElementById("volume");


// ======================================
// 3. RENDER PLAYLIST
// ======================================

function renderPlaylist() {

    playlist.innerHTML = "";

    tracks.forEach((track, index) => {

        const button =
            document.createElement("button");

        button.textContent =
            (index + 1) + ". " + track.name;

        if (index === currentTrack) {

            button.classList.add("active");

        }

        button.onclick = function() {

            loadTrack(index);

        };

        playlist.appendChild(button);

    });

}


// ======================================
// 4. UPDATE TRACK NAME
// ======================================

function updateTrackName() {

    trackName.textContent =
        tracks[currentTrack].name;

    if (playerReady) {

        const info = player.getVideoData();

        if (info && info.title) {

            trackName.textContent =
                info.title;

        }

    }

    renderPlaylist();

}


// ======================================
// 5. YOUTUBE PLAYER
// ======================================

function onYouTubeIframeAPIReady() {

    player = new YT.Player("youtubePlayer", {

        width: "100%",

        height: "170",

        videoId: tracks[0].id,

        playerVars: {

            autoplay: 0,

            controls: 1,

            playsinline: 1,

            rel: 0

        },

        events: {

            onReady: function(event) {

                playerReady = true;

                event.target.setVolume(
                    Number(volume.value)
                );

                statusText.textContent =
                    "Sẵn sàng";

                updateTrackName();

            },

            onStateChange:
                onPlayerStateChange,

            onError: function(event) {

                statusText.textContent =
                    "Video không phát được";

                console.log(
                    "YouTube error:",
                    event.data
                );

            }

        }

    });

}


// ======================================
// 6. PLAYER STATE
// ======================================

function onPlayerStateChange(event) {

    if (event.data === 1) {

        playButton.textContent = "Ⅱ";

        statusText.textContent =
            "Đang phát";

        updateTrackName();

    }

    else if (event.data === 2) {

        playButton.textContent = "▶";

        statusText.textContent =
            "Đã tạm dừng";

    }

    else if (event.data === 0) {

        if (
            repeatPlaylist ||
            currentTrack < tracks.length - 1
        ) {

            nextTrack();

        } else {

            playButton.textContent = "▶";

            statusText.textContent =
                "Đã hết danh sách";

        }

    }

}


// ======================================
// 7. PLAY / PAUSE
// ======================================

function togglePlay() {

    if (!playerReady) {

        statusText.textContent =
            "Đang tải YouTube...";

        return;

    }

    const state =
        player.getPlayerState();

    if (state === 1) {

        player.pauseVideo();

    } else {

        player.playVideo();

    }

}


// ======================================
// 8. LOAD TRACK
// ======================================

function loadTrack(index) {

    if (!playerReady) return;

    currentTrack = index;

    updateTrackName();

    statusText.textContent =
        "Đang tải bài hát";

    playButton.textContent = "▶";

    player.loadVideoById(
        tracks[currentTrack].id
    );

}


// ======================================
// 9. NEXT TRACK
// ======================================

function nextTrack() {

    let next = currentTrack + 1;

    if (next >= tracks.length) {

        next = 0;

    }

    loadTrack(next);

}


// ======================================
// 10. PREVIOUS TRACK
// ======================================

function previousTrack() {

    let previous = currentTrack - 1;

    if (previous < 0) {

        previous = tracks.length - 1;

    }

    loadTrack(previous);

}


// ======================================
// 11. VOLUME
// ======================================

function applyPlayerVolume() {
    if (!playerReady || !player || typeof player.setVolume !== "function") {
        return;
    }

    const nextVolume = Math.max(0, Math.min(100, Number(volume.value)));

    try {
        player.setVolume(nextVolume);
    } catch (error) {
        console.warn("Không thể thay đổi âm lượng YouTube:", error);
    }
}

// "input" cập nhật ngay khi kéo; "change" là dự phòng cho một số trình duyệt di động.
volume.addEventListener("input", applyPlayerVolume);
volume.addEventListener("change", applyPlayerVolume);

// Hỗ trợ thao tác chạm trên màn hình cảm ứng.
volume.addEventListener("touchend", function() {
    window.setTimeout(applyPlayerVolume, 0);
}, { passive: true });

let floatingDockCloseTimer = null;
function cancelFloatingDockClose() {
  if (floatingDockCloseTimer) window.clearTimeout(floatingDockCloseTimer);
  floatingDockCloseTimer = null;
}
function scheduleFloatingDockClose() {
  cancelFloatingDockClose();
  floatingDockCloseTimer = window.setTimeout(() => {
    if (!floatingDock.matches(":hover") && !floatingDock.contains(document.activeElement)) closeFloatingDock();
  }, 2600);
}
floatingDock.addEventListener("pointerenter", () => {
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {

    floatingDock.classList.add("open");
    floatingDockToggle.setAttribute("aria-expanded", "true");
  }
});
floatingDock.addEventListener("pointerleave", () => {
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) scheduleFloatingDockClose();
});

function closeFloatingDock() {
  cancelFloatingDockClose();
  floatingDock.classList.remove("open");
  floatingDockToggle.setAttribute("aria-expanded", "false");
}

/* Focus Timer: 25-minute focus / 5-minute break */
const focusTimerPanel = document.getElementById("focusTimerPanel");
const focusTimerDisplay = document.getElementById("focusTimerDisplay");
const focusTimerMode = document.getElementById("focusTimerMode");
const focusTimerStart = document.getElementById("focusTimerStart");
const focusTimerReset = document.getElementById("focusTimerReset");
const focusTimerToggle = document.getElementById("focusTimerToggle");
const appearanceToggle = document.getElementById("appearanceToggle");
let focusTimerSeconds = 25 * 60;
let focusTimerInitialSeconds = 25 * 60;
let focusTimerInterval = null;

function renderFocusTimer() {
  const minutes = Math.floor(focusTimerSeconds / 60);
  const seconds = focusTimerSeconds % 60;
  focusTimerDisplay.textContent = String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
}
function stopFocusTimer() {
  if (focusTimerInterval) window.clearInterval(focusTimerInterval);
  focusTimerInterval = null;
  focusTimerStart.textContent = "Tiếp tục";
}
function startFocusTimer() {
  if (focusTimerInterval) {
    stopFocusTimer();
    return;
  }
  if (focusTimerSeconds <= 0) focusTimerSeconds = focusTimerInitialSeconds;
  focusTimerStart.textContent = "Tạm dừng";
  focusTimerInterval = window.setInterval(() => {
    focusTimerSeconds = Math.max(0, focusTimerSeconds - 1);
    renderFocusTimer();
    if (focusTimerSeconds === 0) {
      stopFocusTimer();
      focusTimerMode.textContent = "Hoàn thành!";
      focusTimerStart.textContent = "Bắt đầu lại";
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Deutsch-Lernen", { body: "Phiên Focus Timer đã kết thúc!" });
      }
    }
  }, 1000);
}
function setFocusTimer(minutes, mode) {
  stopFocusTimer();
  focusTimerSeconds = minutes * 60;
  focusTimerInitialSeconds = focusTimerSeconds;
  focusTimerMode.textContent = mode;
  focusTimerStart.textContent = "Bắt đầu";
  document.querySelectorAll(".focus-timer-presets button").forEach(button => {
    button.classList.toggle("active", Number(button.dataset.minutes) === minutes);
  });
  renderFocusTimer();
}
focusTimerToggle.addEventListener("click", () => {
  focusTimerPanel.hidden = !focusTimerPanel.hidden;
  closeFloatingDock();
});
document.getElementById("focusTimerClose").addEventListener("click", () => {
  focusTimerPanel.hidden = true;
});
focusTimerStart.addEventListener("click", startFocusTimer);
focusTimerReset.addEventListener("click", () => setFocusTimer(focusTimerInitialSeconds / 60, focusTimerMode.textContent));
document.querySelectorAll(".focus-timer-presets button").forEach(button => {
  button.addEventListener("click", () => {
    const minutes = Number(button.dataset.minutes);
    setFocusTimer(minutes, minutes === 5 ? "Nghỉ ngắn" : "Tập trung");
  });
});
renderFocusTimer();

const focusTimerCustomMinutes = document.getElementById("focusTimerCustomMinutes");
document.getElementById("focusTimerApplyCustom").addEventListener("click", () => {
  const minutes = Number(focusTimerCustomMinutes.value);
  if (!Number.isInteger(minutes) || minutes < 1 || minutes > 999) {
    focusTimerCustomMinutes.setCustomValidity("Hãy nhập số phút từ 1 đến 999.");
    focusTimerCustomMinutes.reportValidity();
    return;
  }
  focusTimerCustomMinutes.setCustomValidity("");
  setFocusTimer(minutes, "Tùy chỉnh");
  focusTimerCustomMinutes.value = String(minutes);
});
focusTimerCustomMinutes.addEventListener("input", () => focusTimerCustomMinutes.setCustomValidity(""));

const focusTimerCustomBreakMinutes = document.getElementById("focusTimerCustomBreakMinutes");
document.getElementById("focusTimerApplyCustomBreak").addEventListener("click", () => {

    focusTimerCustomBreakMinutes.setCustomValidity("Hãy nhập số phút nghỉ từ 1 đến 999.");
    focusTimerCustomBreakMinutes.reportValidity();
    return;
  }
  focusTimerCustomBreakMinutes.setCustomValidity("");
  setFocusTimer(minutes, "Nghỉ tùy chỉnh");
  focusTimerCustomBreakMinutes.value = String(minutes);
});
focusTimerCustomBreakMinutes.addEventListener("input", () => focusTimerCustomBreakMinutes.setCustomValidity(""));

/* Kéo Focus Timer bằng thanh tiêu đề, hoạt động cả trên màn hình cảm ứng. */
(function focusTimerEnableDrag() {
  const handle = document.getElementById("focusTimerDragHandle");
  let dragging = false, startX = 0, startY = 0, startRight = 0, startBottom = 0;
  handle.addEventListener("pointerdown", event => {
    if (event.target.closest("button")) return;
    const rect = focusTimerPanel.getBoundingClientRect();
    dragging = true;
    startX = event.clientX; startY = event.clientY;
    startRight = window.innerWidth - rect.right;
    startBottom = window.innerHeight - rect.bottom;
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener("pointermove", event => {
    if (!dragging) return;
    const rect = focusTimerPanel.getBoundingClientRect();
    const right = Math.max(5, Math.min(window.innerWidth - rect.width - 5, startRight - (event.clientX - startX)));
    const bottom = Math.max(5, Math.min(window.innerHeight - rect.height - 5, startBottom - (event.clientY - startY)));
    focusTimerPanel.style.right = right + "px";
    focusTimerPanel.style.bottom = bottom + "px";
    focusTimerPanel.style.left = "auto";
  });
  const stopDragging = () => { dragging = false; };
  handle.addEventListener("pointerup", stopDragging);
  handle.addEventListener("pointercancel", stopDragging);
})();

/* Sticky Notes: nhiều ghi chú, tự lưu localStorage, kéo thả cửa sổ. */
const stickyNotesWindow = document.getElementById("stickyNotesWindow");
const stickyNotesList = document.getElementById("stickyNotesList");
const stickyNotesToggle = document.getElementById("stickyNotesToggle");
const STICKY_NOTES_KEY = "deutschLernen_sticky_notes_v1";
const stickyNotePalette = ["#fff3a6", "#ffd9df", "#d8f2dc", "#dcecff", "#eadfff"];
let stickyNotes = [];
try {
  const storedNotes = JSON.parse(localStorage.getItem(STICKY_NOTES_KEY) || "[]");
  if (Array.isArray(storedNotes)) stickyNotes = storedNotes;
} catch (e) { stickyNotes = []; }

function saveStickyNotes() {
  try { localStorage.setItem(STICKY_NOTES_KEY, JSON.stringify(stickyNotes)); }
  catch (e) { console.warn("Không thể lưu Sticky Notes:", e); }
}
function renderStickyNotes() {
  stickyNotesList.innerHTML = "";
  if (!stickyNotes.length) {
    const empty = document.createElement("div");
    empty.textContent = "Chưa có ghi chú. Nhấn + để tạo ghi chú đầu tiên.";
    empty.style.cssText = "padding:22px 12px;color:#778396;text-align:center;font-size:12px;line-height:1.6;";
    stickyNotesList.appendChild(empty);
    return;
  }
  stickyNotes.forEach(note => {
    const card = document.createElement("article");
    card.className = "sticky-note-card";
    card.style.background = note.color || stickyNotePalette[0];
    const textarea = document.createElement("textarea");
    textarea.placeholder = "Viết ghi chú của cậu...";
    textarea.value = note.text || "";
    textarea.setAttribute("aria-label", "Nội dung ghi chú");
    textarea.addEventListener("input", () => {
      note.text = textarea.value;
      saveStickyNotes();
    });
    const tools = document.createElement("div");
    tools.className = "sticky-note-card-tools";
    const colors = document.createElement("div");
    colors.className = "sticky-note-colors";
    stickyNotePalette.forEach(color => {
      const swatch = document.createElement("button");
      swatch.type = "button";
      swatch.className = "sticky-note-color";
      swatch.style.background = color;
      swatch.title = "Đổi màu ghi chú";
      swatch.setAttribute("aria-label", "Đổi màu ghi chú");
      swatch.addEventListener("click", () => {
        note.color = color;
        card.style.background = color;
        saveStickyNotes();
      });
      colors.appendChild(swatch);
    });
    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "sticky-note-delete";
    remove.textContent = "Xóa ghi chú";
    remove.addEventListener("click", () => {
      stickyNotes = stickyNotes.filter(item => item.id !== note.id);
      saveStickyNotes();
      renderStickyNotes();
    });
    tools.append(colors, remove);
    card.append(textarea, tools);
    stickyNotesList.appendChild(card);
  });
}
function addStickyNote() {
  stickyNotes.unshift({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    text: "",
    color: stickyNotePalette[stickyNotes.length % stickyNotePalette.length]
  });
  saveStickyNotes();
  renderStickyNotes();
  const firstNote = stickyNotesList.querySelector("textarea");
  if (firstNote) firstNote.focus();
}
stickyNotesToggle.addEventListener("click", () => {
  stickyNotesWindow.hidden = !stickyNotesWindow.hidden;
  if (!stickyNotesWindow.hidden && !stickyNotes.length) addStickyNote();
  closeFloatingDock();
});
document.getElementById("stickyNotesAdd").addEventListener("click", addStickyNote);
document.getElementById("stickyNotesClose").addEventListener("click", () => stickyNotesWindow.hidden = true);
renderStickyNotes();

/* Kéo cửa sổ Sticky Notes bằng thanh tiêu đề. */
(function stickyNotesEnableDrag() {
  const handle = document.getElementById("stickyNotesDragHandle");
  let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
  handle.addEventListener("pointerdown", event => {
    if (event.target.closest("button")) return;
    const rect = stickyNotesWindow.getBoundingClientRect();
    dragging = true;
    startX = event.clientX; startY = event.clientY;
    startLeft = rect.left; startTop = rect.top;
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener("pointermove", event => {
    if (!dragging) return;
    const rect = stickyNotesWindow.getBoundingClientRect();
    const left = Math.max(5, Math.min(window.innerWidth - rect.width - 5, startLeft + event.clientX - startX));
    const top = Math.max(5, Math.min(window.innerHeight - 55, startTop + event.clientY - startY));
    stickyNotesWindow.style.left = left + "px";
    stickyNotesWindow.style.top = top + "px";
  });
  const stop = () => dragging = false;
  handle.addEventListener("pointerup", stop);
  handle.addEventListener("pointercancel", stop);
})();

/* Appearance: remember Light / Dark preference and apply to same-origin iframe. */
function applyAppearance(theme) {
  document.documentElement.classList.toggle("app-dark", theme === "dark");
  document.documentElement.style.colorScheme = theme;
  appearanceToggle.querySelector(".dock-tool-symbol").textContent = theme === "dark" ? "☀" : "◐";
  appearanceToggle.title = theme === "dark" ? "Chuyển sang giao diện sáng" : "Chuyển sang giao diện tối";
  try {
    const frameDoc = document.getElementById("website").contentDocument;
    if (frameDoc) {
      frameDoc.documentElement.style.colorScheme = theme;
      frameDoc.documentElement.classList.toggle("app-dark", theme === "dark");
      let themeStyle = frameDoc.getElementById("dockAppearanceTheme");
      if (!themeStyle) {
        themeStyle = frameDoc.createElement("style");
        themeStyle.id = "dockAppearanceTheme";
        frameDoc.head.appendChild(themeStyle);
      }
      themeStyle.textContent = theme === "dark"
        ? "body{background-color:#101722!important;color:#e8eef7!important;} "
        : "body{background-color:#fff!important;color:#202124!important;}";
    }
  } catch (error) {
    console.warn("Không thể áp dụng Appearance cho trang bên trong:", error);
  }
  try { localStorage.setItem("deutschLernen_appearance", theme); } catch (e) {}
}
let currentAppearance = "light";
try { currentAppearance = localStorage.getItem("deutschLernen_appearance") || "light"; } catch (e) {}

document.getElementById("website").addEventListener("load", () => applyAppearance(currentAppearance));

try {
  const saved = JSON.parse(localStorage.getItem(AI_STORAGE_KEY) || "[]");
  if (Array.isArray(saved)) aiHistory = saved.slice(-40);
} catch (e) { aiHistory = []; }

function aiSaveHistory() {
  try { localStorage.setItem(AI_STORAGE_KEY, JSON.stringify(aiHistory.slice(-40))); }
  catch (e) { console.warn("Không thể lưu lịch sử AI:", e); }
}
function aiAddMessage(role, content, extraClass = "") {
  const item = document.createElement("div");
  item.className = "ai-msg " + (role === "user" ? "user" : "bot") + (extraClass ? " " + extraClass : "");
  item.textContent = content;
  aiMessages.appendChild(item);
  aiMessages.scrollTop = aiMessages.scrollHeight;
  return item;
}
function aiRenderHistory() {
  aiMessages.innerHTML = "";
  if (!aiHistory.length) {
    aiAddMessage("assistant", "Chào cậu! Hãy gửi câu hỏi tiếng Đức nhé.");
    return;
  }
  aiHistory.forEach(m => aiAddMessage(m.role, m.content));
}
function aiHide() {
  aiWindow.style.display = "none";
  aiRestoreButton.classList.add("show");
  updateAIRestorePosition();
  closeFloatingDock();
}
function aiShow() {

}

// Kéo cửa sổ bằng thanh tiêu đề; không chặn thao tác nút.
(function aiEnableDrag() {
  const handle = document.getElementById("aiDragHandle");
  let dragging = false, startX = 0, startY = 0, startRight = 0, startBottom = 0;
  handle.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    const rect = aiWindow.getBoundingClientRect();
    dragging = true; startX = e.clientX; startY = e.clientY;
    startRight = window.innerWidth - rect.right; startBottom = window.innerHeight - rect.bottom;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove", e => {
    if (!dragging) return;
    const rect = aiWindow.getBoundingClientRect();
    const right = Math.max(5, Math.min(window.innerWidth - rect.width - 5, startRight - (e.clientX - startX)));
    const bottom = Math.max(5, Math.min(window.innerHeight - rect.height - 5, startBottom - (e.clientY - startY)));
    aiWindow.style.setProperty("right", right + "px", "important");
    aiWindow.style.setProperty("bottom", bottom + "px", "important");
    aiWindow.style.setProperty("left", "auto", "important");
  });
  handle.addEventListener("pointerup", () => dragging = false);
  handle.addEventListener("pointercancel", () => dragging = false);
})();

async function aiSendMessage(text) {
  const message = text.trim();
  if (!message || aiSend.disabled) return;
  aiHistory.push({ role: "user", content: message });
  aiHistory = aiHistory.slice(-40);
  aiSaveHistory();
  aiAddMessage("user", message);
  aiInput.value = "";
  aiSend.disabled = true;
  const typing = aiAddMessage("assistant", "Đang suy nghĩ...", "ai-typing");
  const context = aiHistory.slice(-12).map(m => ({ role: m.role, content: m.content }));
  try {
    const response = await fetch(AI_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "chat", level: "B2", messages: context })
    });
    const data = await response.json();
    if (!response.ok || !data.reply) throw new Error(data.error || data.details || "Không nhận được phản hồi từ AI.");
    typing.remove();
    aiHistory.push({ role: "assistant", content: data.reply });
    aiHistory = aiHistory.slice(-40);
    aiSaveHistory();
    aiAddMessage("assistant", data.reply);
  } catch (error) {
    typing.remove();
    aiAddMessage("assistant", "Tớ chưa kết nối được với AI. Cậu kiểm tra Worker đã được cập nhật phiên bản có action chat chưa nhé.\nChi tiết: " + error.message, "error");
  } finally {
    aiSend.disabled = false;
    aiInput.focus();
  }
}
aiForm.addEventListener("submit", e => {
  e.preventDefault();
  aiSendMessage(aiInput.value);
});
aiInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); aiForm.requestSubmit(); }
});
aiRenderHistory();
