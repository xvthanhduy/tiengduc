
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiếng Đức cùng humbert.vo</title>

<!-- FONT CHỮ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   THIẾT LẬP CHUNG
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    font-family: 'Be Vietnam Pro', 'Inter', sans-serif;

    color: white;

    background-image: url("11.jpg");
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow-x: hidden;
}

/* =========================
   TIÊU ĐỀ GÓC TRÊN BÊN TRÁI
========================= */

.header {
    position: absolute;
    top: 45px;
    left: 65px;

    z-index: 10;
}

.header h1 {
    font-family: 'Be Vietnam Pro', sans-serif;

    font-size: clamp(24px, 3vw, 36px);
    font-weight: 800;
    letter-spacing: 1px;

    color: #ffffff;

    text-shadow: 0 3px 15px rgba(0,0,0,0.55);
}

/* =========================
   KHU VỰC CHÍNH
========================= */

.main {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    align-items: center;
    justify-content: flex-start;

    padding-left: 65px;
    padding-right: 30px;
}

/* =========================
   KHUNG B2
========================= */

.level-card {
    position: relative;

    width: 260px;
    padding: 24px;

    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 16px;

    background: rgba(255,255,255,0.13);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow: 0 8px 30px rgba(0,0,0,0.16);

    cursor: pointer;

    transition:
        background 0.3s ease,
        transform 0.3s ease;
}

.level-card:hover {
    background: rgba(255,255,255,0.20);
    transform: translateY(-3px);
}

/* =========================
   CHỮ B2
========================= */

.level-title {
    font-family: 'Inter', sans-serif;

    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;

    text-align: center;
    color: white;

    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* =========================
   GỢI Ý RÊ CHUỘT
========================= */

.hint {
    margin-top: 8px;

    font-size: 10px;
    text-align: center;

    color: rgba(255,255,255,0.9);

    transition: opacity 0.3s ease;
}

.level-card:hover .hint,
.level-card.open .hint {
    opacity: 0;
}

/* =========================
   MENU CON - MÁY TÍNH
   SỔ NGANG SANG PHẢI
   SAU ĐÓ XẾP DỌC
========================= */

.menu {
    position: absolute;

    top: 0;
    left: calc(100% + 18px);

    width: 180px;

    display: flex;
    flex-direction: column;
    gap: 12px;

    max-height: 0;
    opacity: 0;

    overflow: hidden;

    transform: translateX(-20px);

    transition:
        max-height 0.65s ease,
        opacity 0.4s ease,
        transform 0.5s ease;
}

/* MỞ MENU */

.level-card:hover .menu,
.level-card.open .menu {
    max-height: 180px;
    opacity: 1;

    overflow: visible;

    transform: translateX(0);
}

/* =========================
   CÁC THƯ MỤC NHỎ
========================= */

.menu a {
    display: block;

    width: 100%;

    text-decoration: none;
    color: white;

    padding: 18px 12px;

    border: 1px solid rgba(255,255,255,0.42);
    border-radius: 11px;

    /* HIỆU ỨNG KÍNH MỜ */

    background: rgba(255,255,255,0.17);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    text-align: center;

    box-shadow: 0 4px 15px rgba(0,0,0,0.10);

    opacity: 0;

    transform: translateY(-12px);

    transition:
        opacity 0.4s ease,
        transform 0.4s ease,
        background 0.3s ease,
        border-color 0.3s ease;
}

/* HIỆU ỨNG XUẤT HIỆN */

.level-card:hover .menu a,
.level-card.open .menu a {
    opacity: 1;
    transform: translateY(0);
}

/* XUẤT HIỆN LẦN LƯỢT */

.menu a:nth-child(1) {
    transition-delay: 0.12s;
}

.menu a:nth-child(2) {
    transition-delay: 0.25s;
}

/* HOVER TỪNG MỤC */

.menu a:hover {
    background: rgba(255,255,255,0.32);
    border-color: white;
}

/* CHỮ TRONG MENU */

.menu h2 {
    font-size: 15px;
    font-weight: 600;

    margin-bottom: 5px;
}

.menu p {
    font-size: 12px;
    color: #ffffff;
}

/* =========================
   SLOGAN GÓC DƯỚI BÊN TRÁI
========================= */

.footer {
    position: absolute;

    bottom: 35px;
    left: 65px;

    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;

    color: #ffffff;

    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
}

/* =========================
   ĐIỆN THOẠI VÀ MÀN HÌNH NHỎ
========================= */

@media (max-width: 600px) {

    body {
        background-attachment: scroll;
    }

    /* TIÊU ĐỀ */

    .header {
        top: 28px;
        left: 25px;
        right: 20px;
    }

    .header h1 {
        font-size: clamp(21px, 6vw, 26px);
        line-height: 1.4;
    }

    /* KHU VỰC CHÍNH */

    .main {
        justify-content: center;

        padding-left: 20px;
        padding-right: 20px;

        padding-top: 100px;
        padding-bottom: 100px;
    }

    /* KHUNG B2 */

    .level-card {
        width: 220px;
        padding: 22px;
    }

    /* MENU CHUYỂN XUỐNG BÊN DƯỚI B2 */

    .menu {
        position: static;

        width: 100%;

        display: flex;
        flex-direction: column;
        gap: 12px;

        max-height: 0;
        margin-top: 0;

        transform: translateY(-12px);
    }

    .level-card:hover .menu,
    .level-card.open .menu {
        max-height: 180px;
        margin-top: 16px;

        opacity: 1;
        transform: translateY(0);

        overflow: visible;
    }

    /* THƯ MỤC NHỎ */

    .menu a {
        padding: 16px 12px;
    }

    .menu h2 {
        font-size: 15px;
    }

    .menu p {
        font-size: 12px;
    }

    /* SLOGAN */

    .footer {
        left: 25px;
        bottom: 25px;

        font-size: 11px;
        letter-spacing: 0.5px;
    }
}

/* =========================
   TABLET
========================= */

@media (min-width: 601px) and (max-width: 900px) {

    .header {
        left: 40px;
        top: 35px;
    }

    .main {
        padding-left: 40px;
    }

    .footer {
        left: 40px;
    }

}

/* =========================
   GIẢM CHUYỂN ĐỘNG
========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
    }

}

</style>
</head>

<body>

<!-- =========================
     TIÊU ĐỀ
========================= -->

<header class="header">
    <h1>Tiếng Đức cùng humbert.vo</h1>
</header>


<!-- =========================
     KHU VỰC CẤP ĐỘ
========================= -->

<main class="main">

    <div class="level-card" id="levelB2">

        <div class="level-title">
            B2
        </div>

        <div class="hint">
            Di chuyển chuột vào đây
        </div>

        <div class="menu">

            <a href="lesen.html">
                <h2>Lesen</h2>
                <p>Đọc</p>
            </a>

            <a href="wortschatz.html">
                <h2>Wortschatz</h2>
                <p>Từ vựng</p>
            </a>

        </div>

    </div>

</main>


<!-- =========================
     SLOGAN
========================= -->

<footer class="footer">
    Học, học nữa, học mãi
</footer>


<!-- =========================
     TƯƠNG TÁC MÁY TÍNH VÀ ĐIỆN THOẠI
========================= -->

<script>

const levelB2 = document.getElementById("levelB2");

const touchDevice = window.matchMedia("(hover: none)");

levelB2.addEventListener("click", function(event) {

    // Không đóng menu khi nhấn vào Lesen hoặc Wortschatz
    if (event.target.closest("a")) {
        return;
    }

    // Trên thiết bị cảm ứng:
    // Chạm B2 để mở hoặc đóng menu
    if (touchDevice.matches) {
        levelB2.classList.toggle("open");
    }

});

// Đóng menu khi nhấn phím Escape
document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        levelB2.classList.remove("open");
    }

});

</script>

</body>
</html>
