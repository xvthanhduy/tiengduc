
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch-Lernen B2</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #101b1c;
}

/* =========================================
   WEBSITE
========================================= */

#website {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* =========================================
   GLASS WINDOWS MUSIC PLAYER
========================================= */

.music-player {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 9999;

    width: 350px;

    color: #f4fff8;

    background:
        linear-gradient(
            135deg,
            rgba(28, 54, 49, 0.88),
            rgba(15, 31, 34, 0.91)
        );

    border: 1px solid rgba(179, 255, 211, 0.25);
    border-radius: 17px;

    box-shadow:
        0 18px 55px rgba(0, 0, 0, 0.38),
        0 0 25px rgba(87, 220, 145, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.13);

    backdrop-filter: blur(28px) saturate(150%);
    -webkit-backdrop-filter: blur(28px) saturate(150%);

    overflow: hidden;

    transition:
        width 0.25s ease,
        transform 0.25s ease,
        opacity 0.25s ease;
}

/* =========================================
   WINDOWS TITLE BAR
========================================= */

.title-bar {
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding-left: 14px;

    background: rgba(255,255,255,0.055);

    border-bottom: 1px solid rgba(255,255,255,0.10);

    user-select: none;
}

.title-left {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
}

.title-icon {
    color: #8FF0B2;
    font-size: 18px;

    text-shadow:
        0 0 12px rgba(114,255,168,0.5);
}

.window-controls {
    display: flex;
    height: 100%;
}

.window-controls button {
    width: 40px;
    height: 100%;

    border: none;
    background: transparent;

    color: rgba(255,255,255,0.9);
    font-family: "Segoe UI", sans-serif;
    font-size: 14px;

    cursor: pointer;
    transition: background 0.15s;
}

.window-controls button:hover {
    background: rgba(255,255,255,0.14);
}

.window-controls .close-button:hover {
    background: #C42B1C;
    color: white;
}

/* =========================================
   PLAYER CONTENT
========================================= */

.player-content {
    padding: 14px;
}

#youtubePlayer {
    width: 100%;
    height: 200px;
    min-width: 200px;
    min-height: 200px;

    overflow: hidden;
    border-radius: 11px;

    background: #080808;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.25);
}

.track-name {
    margin-top: 13px;
    margin-bottom: 5px;

    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;

    overflow-wrap: anywhere;
}

.player-status {
    color: #9BE8B5;
    font-size: 10px;
    margin-top: 5px;
}

/* =========================================
   MUSIC CONTROLS
========================================= */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;

    margin: 13px 0;
}

.controls button {
    border: none;
    background: transparent;

    color: #f4fff8;
    font-size: 20px;

    cursor: pointer;
    transition: 0.2s;
}

.controls button:hover {
    color: #91F2B5;
    transform: scale(1.12);

    text-shadow:
        0 0 12px rgba(122,255,173,0.4);
}

.controls .play-button {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            rgba(130, 242, 174, 0.30),
            rgba(67, 170, 117, 0.20)
        );

    border: 1px solid rgba(174,255,203,0.25);

    font-size: 19px;

    box-shadow:
        0 0 18px rgba(105,235,155,0.10);
}

/* =========================================
   VOLUME
========================================= */

.volume-row {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 13px;
}

.volume-row input {
    flex: 1;
    accent-color: #8CE9AA;
    cursor: pointer;
}

/* =========================================
   FOOTER
========================================= */

.player-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 14px;
}

.player-footer button {
    border: none;
    background: transparent;

    color: rgba(255,255,255,0.85);
    font-size: 11px;

    cursor: pointer;
}

.player-footer button:hover {
    color: #9CF4BA;
}

/* =========================================
   PLAYLIST
========================================= */

.playlist {
    display: none;

    margin-top: 12px;
    padding-top: 9px;

    border-top: 1px solid rgba(255,255,255,0.13);

    max-height: 135px;
    overflow-y: auto;
}

.playlist.show {
    display: block;
}

.playlist button {
    display: block;
    width: 100%;

    padding: 10px;

    border: 1px solid transparent;
    border-radius: 8px;

    background: transparent;
    color: white;

    font-size: 12px;
    text-align: left;

    cursor: pointer;
    transition: 0.2s;
}

.playlist button:hover,
.playlist button.active {
    background: rgba(133, 232, 170, 0.13);
    border-color: rgba(144, 241, 177, 0.15);
}

/* =========================================
   MINIMIZED WINDOW
========================================= */

.music-player.minimized {
    width: 285px;
}

.music-player.minimized #youtubePlayer,
.music-player.minimized .track-name,
.music-player.minimized .volume-row,
.music-player.minimized .player-footer,
.music-player.minimized .player-status,
.music-player.minimized .playlist {
    display: none;
}

.music-player.minimized .player-content {
    padding: 8px 12px 12px;
}

.music-player.minimized .controls {
    margin: 0;
    gap: 25px;
}

.music-player.minimized .controls button {
    font-size: 18px;
}

.music-player.minimized .controls .play-button {
    width: 37px;
    height: 37px;
}

/* =========================================
   MAXIMIZED WINDOW
========================================= */

.music-player.maximized {
    width: min(650px, calc(100vw - 32px));

    right: 50%;
    bottom: 50%;

    transform: translate(50%, 50%);
}

.music-player.maximized #youtubePlayer {
    height: 300px;
}

.music-player.maximized .player-content {
    padding: 20px;
}

/* =========================================
   HIDDEN PLAYER / FLOATING BUTTON
========================================= */

.restore-button {
    position: fixed;
    right: 25px;
    bottom: 25px;

    z-index: 10000;

    width: 54px;
    height: 54px;

    border: 1px solid rgba(180,255,211,0.28);
    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(35,75,59,0.94),
            rgba(16,39,39,0.96)
        );

    color: #9CF2B7;
    font-size: 24px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30),
        0 0 18px rgba(100,240,155,0.15);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    cursor: pointer;

    display: none;

    transition: 0.2s;
}

.restore-button:hover {
    transform: scale(1.08);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30),
        0 0 25px rgba(100,240,155,0.30);
}

.restore-button.show {
    display: block;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .music-player {
        right: 12px;
        bottom: 12px;

        width: calc(100% - 24px);
    }

    .music-player.minimized {
        width: min(285px, calc(100vw - 24px));
    }

    .music-player.maximized {
        width: calc(100vw - 24px);
    }

    .music-player.maximized #youtubePlayer {
        height: 220px;
    }

    .restore-button {
        right: 15px;
        bottom: 15px;
    }
}

/* =========================================
   MOBILE FIX: WINDOW CONTROLS + VOLUME
   Giữ nguyên giao diện desktop.
========================================= */

.title-bar {
    display: flex;
    min-width: 0;
}

.title-left {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
}

.title-left span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.window-controls {
    display: flex !important;
    flex: 0 0 auto;
    flex-shrink: 0;
    margin-left: 6px;
    position: relative;
    z-index: 5;
}

.window-controls button {
    flex: 0 0 40px;
    min-width: 0;
    touch-action: manipulation;
}

.volume-row {
    position: relative;
    z-index: 2;
    min-width: 0;
}

.volume-row input[type="range"] {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    height: 28px;
    margin: 0;
    padding: 0;
    touch-action: pan-x;
    pointer-events: auto;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
}

.volume-row input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 99px;
    background: #697386;
}

.volume-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -6px;
    border-radius: 50%;
    background: #60a5fa;
    border: 2px solid #eaf2ff;
}

.volume-row input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 99px;
    background: #697386;
}

.volume-row input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #60a5fa;
    border: 2px solid #eaf2ff;
}

@media (max-width: 600px) {
    .title-bar {
        height: 44px;
        padding-left: 10px;
    }

    .title-left {
        gap: 6px;
        font-size: 11px;
    }

    .window-controls {
        visibility: visible !important;
        opacity: 1 !important;
    }

    .window-controls button {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 34px;
        flex-basis: 34px;
        height: 44px;
        font-size: 13px;
    }

    .volume-row {
        gap: 9px;
        padding: 3px 0;
    }

    .volume-row input[type="range"] {
        min-height: 32px;
    }
}


/* =========================================
   COMPACT PLAYER: small screens / short windows
   Giữ thanh tiêu đề và 3 nút cửa sổ luôn nhìn thấy.
========================================= */

    width: 320px;
    max-width: calc(100vw - 20px);
}

.music-player #youtubePlayer {
    height: 170px;
}

.music-player .player-content {
    padding: 12px;
}

.title-bar {
    min-height: 42px;
    height: 42px;
}

.window-controls {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    flex: 0 0 auto;
}

.window-controls button {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    width: 34px;
    flex: 0 0 34px;
    height: 42px;
    padding: 0;
}

/* Cửa sổ có chiều cao thấp: thu gọn nội dung, không ẩn title bar */

    }

    }
    .music-player .track-name {

        font-size: 13px;
    }
    .music-player .controls {

        gap: 18px;
    }
    .music-player .controls .play-button {

        height: 40px;
    }
    .music-player .player-footer {

    }
}

@media (max-width: 600px) {
    .music-player,
    .music-player.maximized {
        right: 10px;
        bottom: 10px;
        left: 10px;
        width: auto;
        max-width: none;
        max-height: calc(100dvh - 20px);
        overflow-y: auto;
    }

    .music-player #youtubePlayer {
        height: 150px;
    }

    .music-player.maximized #youtubePlayer {
        height: 180px;
    }

    .title-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(35, 40, 53, .98);
    }

    .title-left {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 10px;
    }

    .window-controls button {
        width: 32px;
        flex-basis: 32px;
        height: 42px;
    }

    .volume-row input[type="range"] {
        min-width: 0;
        width: 100%;
        min-height: 38px;
        touch-action: pan-y;
        cursor: pointer;
    }
}

@media (max-width: 380px) {
    .title-left span:last-child {
        max-width: 90px;
    }
    .window-controls button {
        width: 29px;
        flex-basis: 29px;
        font-size: 12px;
    }
}


/* =========================================
   DEUTSCH AI — MINIMAL UI, persistent parent shell
========================================= */
.ai-mini {
    position: fixed; left: 25px; right: auto; bottom: 25px; z-index: 10001;
    width: 350px; height: 490px; max-height: min(72vh, 650px);
    display: flex; flex-direction: column; overflow: hidden;
    color: #202124; background: #ffffff;
    border: 1px solid #e5e7eb; border-radius: 16px;
    box-shadow: 0 12px 36px rgba(20, 25, 35, .16);
    transition: height .22s ease, width .22s ease, opacity .2s ease;
}
.ai-mini.ai-left { right: auto; left: 25px; }
.ai-head {
    min-height: 54px; display:flex; align-items:center; justify-content:space-between;
    padding: 0 12px 0 16px; background:#fff;
    border-bottom:1px solid #eef0f2; cursor:move; user-select:none;
}
.ai-brand { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:650; color:#202124; }
.ai-brand-mark {
    width:30px; height:30px; display:grid; place-items:center; border-radius:10px;
    color:#fff; background:#252a31; font-size:14px; font-weight:700;
}
.ai-brand-copy { display:flex; flex-direction:column; gap:2px; }
.ai-brand-copy small { color:#8a9099; font-size:10px; font-weight:400; }
.ai-window-controls { display:flex; gap:3px; }
.ai-window-controls button {
    width:29px; height:29px; border:0; border-radius:8px;
    color:#626873; background:transparent; cursor:pointer; font-size:15px;
}
.ai-window-controls button:hover { background:#f1f2f4; color:#202124; }
.ai-window-controls .ai-close:hover { background:#fff0f0; color:#c43d3d; }
.ai-content { flex:1; min-height:0; display:flex; flex-direction:column; background:#fff; }
.ai-messages {
    flex:1; min-height:0; overflow:auto; padding:10px 12px 14px;
    display:flex; flex-direction:column; gap:9px;
}
.ai-msg {
    max-width:90%; padding:9px 11px; border-radius:12px; font-size:12.5px;
    line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere;

<!-- FLOATING RESTORE BUTTON -->

<button
    class="restore-button"
    id="restoreButton"
    onclick="restorePlayer()"
    title="Mở trình phát nhạc"
    aria-label="Mở trình phát nhạc">
    ♫
</button>


<script>

// ======================================
// 1. YOUTUBE PLAYLIST
// ======================================

const tracks = [

    {
        id: "L1IPbx28wAM",
        name: "Bài hát 1"
    },

    {
        id: "jc7Q1X0LeyY",
        name: "Bài hát 2"
    },

    {
        id: "dNPl-QqqJ6w",
        name: "Bài hát 3"
    }

];


// ======================================
// 2. PLAYER VARIABLES
// ======================================

let currentTrack = 0;

let repeatPlaylist = true;

let player = null;

let playerReady = false;

const musicPlayer =
    document.getElementById("musicPlayer");

const restoreButton =
    document.getElementById("restoreButton");

const playButton =
    document.getElementById("playButton");

const trackName =
    document.getElementById("trackName");

const statusText =
    document.getElementById("status");

const playlist =
    document.getElementById("playlist");

const volume =
    document.getElementById("volume");


// ======================================
// 3. RENDER PLAYLIST
// ======================================

function renderPlaylist() {

    playlist.innerHTML = "";

    tracks.forEach((track, index) => {

        const button =
            document.createElement("button");

        button.textContent =
            (index + 1) + ". " + track.name;

        if (index === currentTrack) {

            button.classList.add("active");

        }

        button.onclick = function() {

            loadTrack(index);

        };

        playlist.appendChild(button);

    });

}


// ======================================
// 4. UPDATE TRACK NAME
// ======================================

function updateTrackName() {

    trackName.textContent =
        tracks[currentTrack].name;

    if (playerReady) {

        const info = player.getVideoData();

        if (info && info.title) {

            trackName.textContent =
                info.title;

        }

    }

    renderPlaylist();

}


// ======================================
// 5. YOUTUBE PLAYER
// ======================================

function onYouTubeIframeAPIReady() {

    player = new YT.Player("youtubePlayer", {

        width: "100%",

        height: "170",

        videoId: tracks[0].id,

        playerVars: {

            autoplay: 0,

            controls: 1,

            playsinline: 1,

            rel: 0

        },

        events: {

            onReady: function(event) {

                playerReady = true;

                event.target.setVolume(
                    Number(volume.value)
                );

                statusText.textContent =
                    "Sẵn sàng";

                updateTrackName();

            },

            onStateChange:
                onPlayerStateChange,

            onError: function(event) {

                statusText.textContent =
                    "Video không phát được";

                console.log(
                    "YouTube error:",
                    event.data
                );

            }

        }

    });

}


// ======================================
// 6. PLAYER STATE
// ======================================

function onPlayerStateChange(event) {

    if (event.data === 1) {

        playButton.textContent = "Ⅱ";

        statusText.textContent =
            "Đang phát";

        updateTrackName();

    }

    else if (event.data === 2) {

        playButton.textContent = "▶";

        statusText.textContent =
            "Đã tạm dừng";

    }

    else if (event.data === 0) {

        if (
            repeatPlaylist ||
            currentTrack < tracks.length - 1
        ) {

            nextTrack();

        } else {

            playButton.textContent = "▶";

            statusText.textContent =
                "Đã hết danh sách";

        }

    }

}


// ======================================
// 7. PLAY / PAUSE
// ======================================

function togglePlay() {

    if (!playerReady) {

        statusText.textContent =
            "Đang tải YouTube...";

        return;

    }

    const state =
        player.getPlayerState();

    if (state === 1) {

        player.pauseVideo();

    } else {

        player.playVideo();

    }

}


// ======================================
// 8. LOAD TRACK
// ======================================

function loadTrack(index) {

    if (!playerReady) return;

    currentTrack = index;

    updateTrackName();

    statusText.textContent =
        "Đang tải bài hát";

    playButton.textContent = "▶";

    player.loadVideoById(
        tracks[currentTrack].id
    );

}


// ======================================
// 9. NEXT TRACK
// ======================================

function nextTrack() {

    let next = currentTrack + 1;

    if (next >= tracks.length) {

        next = 0;

    }

    loadTrack(next);

}


// ======================================
// 10. PREVIOUS TRACK
// ======================================

function previousTrack() {

    let previous = currentTrack - 1;

    if (previous < 0) {

        previous = tracks.length - 1;

    }

    loadTrack(previous);

}


// ======================================
// 11. VOLUME
// ======================================

function applyPlayerVolume() {
    if (!playerReady || !player || typeof player.setVolume !== "function") {
        return;
    }

    const nextVolume = Math.max(0, Math.min(100, Number(volume.value)));

    try {
        player.setVolume(nextVolume);
    } catch (error) {
        console.warn("Không thể thay đổi âm lượng YouTube:", error);
    }
}

// "input" cập nhật ngay khi kéo; "change" là dự phòng cho một số trình duyệt di động.
volume.addEventListener("input", applyPlayerVolume);
volume.addEventListener("change", applyPlayerVolume);

// Hỗ trợ thao tác chạm trên màn hình cảm ứng.
volume.addEventListener("touchend", function() {
    window.setTimeout(applyPlayerVolume, 0);
}, { passive: true });


// ======================================
// 12. PLAYLIST TOGGLE
// ======================================

function togglePlaylist() {

    playlist.classList.toggle("show");

    const isOpen =
        playlist.classList.contains("show");

    document.getElementById(
        "playlistToggle"
    ).textContent =

        isOpen
            ? "☷ Ẩn danh sách"
            : "☷ Danh sách nhạc";

}


// ======================================
// 13. REPEAT
// ======================================

function toggleRepeat() {

    repeatPlaylist = !repeatPlaylist;

    document.getElementById(
        "repeatButton"
    ).textContent =

        repeatPlaylist
            ? "↻ Lặp: Bật"
            : "↻ Lặp: Tắt";

}


// ======================================
// 16. HIDE WINDOW
// ======================================

function hidePlayer() {
    musicPlayer.style.display = "none";
    restoreButton.classList.add("show");
    updateAIRestorePosition();
}

// ======================================
// RESTORE PLAYER — chỉ bật/tắt, không đổi kích thước
// ======================================

function restorePlayer() {
    musicPlayer.style.display = "block";
    restoreButton.classList.remove("show");
    updateAIRestorePosition();
}

// Khi trình phát đang mở, đặt nút khôi phục AI ở góc trái.
// Khi trình phát bị tắt, xếp biểu tượng AI ngay phía trên biểu tượng nhạc.
function updateAIRestorePosition() {
    const playerIsHidden = musicPlayer.style.display === "none";
    aiRestoreButton.style.left = playerIsHidden ? "auto" : "25px";
    aiRestoreButton.style.right = playerIsHidden ? "25px" : "auto";
    aiRestoreButton.style.bottom = playerIsHidden ? "88px" : "25px";
}


// ======================================
// 18. LOAD YOUTUBE API
// ======================================

const youtubeScript =
    document.createElement("script");

youtubeScript.src =
    "https://www.youtube.com/iframe_api";

document.head.appendChild(youtubeScript);


// ======================================
// 19. INITIALIZE
// ======================================

renderPlaylist();


// ======================================
// AI MINI PLAYER — chat + lịch sử
// ======================================
const AI_WORKER_URL = "https://german-schreiben-ai.xv-thanhduy.workers.dev";
const aiWindow = document.getElementById("aiMini");
const aiRestoreButton = document.getElementById("aiRestore");
const aiMessages = document.getElementById("aiMessages");
const aiForm = document.getElementById("aiForm");
const aiInput = document.getElementById("aiInput");
const aiSend = document.getElementById("aiSend");
const AI_STORAGE_KEY = "deutschLernen_ai_chat_v1";
let aiHistory = [];
updateAIRestorePosition();

try {
  const saved = JSON.parse(localStorage.getItem(AI_STORAGE_KEY) || "[]");
  if (Array.isArray(saved)) aiHistory = saved.slice(-40);
} catch (e) { aiHistory = []; }

function aiSaveHistory() {
  try { localStorage.setItem(AI_STORAGE_KEY, JSON.stringify(aiHistory.slice(-40))); }
  catch (e) { console.warn("Không thể lưu lịch sử AI:", e); }
}
function aiAddMessage(role, content, extraClass = "") {
  const item = document.createElement("div");
  item.className = "ai-msg " + (role === "user" ? "user" : "bot") + (extraClass ? " " + extraClass : "");
  item.textContent = content;
  aiMessages.appendChild(item);
  aiMessages.scrollTop = aiMessages.scrollHeight;
  return item;
}
function aiRenderHistory() {
  aiMessages.innerHTML = "";
  if (!aiHistory.length) {
    aiAddMessage("assistant", "Chào cậu! Hãy gửi câu hỏi tiếng Đức nhé.");
    return;
  }
  aiHistory.forEach(m => aiAddMessage(m.role, m.content));
}
function aiHide() {
  aiWindow.style.display = "none";
  aiRestoreButton.classList.add("show");
  updateAIRestorePosition();
}
function aiShow() {
  aiWindow.style.display = "flex";
  aiRestoreButton.classList.remove("show");
}

// Kéo cửa sổ bằng thanh tiêu đề; không chặn thao tác nút.
(function aiEnableDrag() {
  const handle = document.getElementById("aiDragHandle");
  let dragging = false, startX = 0, startY = 0, startRight = 0, startBottom = 0;
  handle.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || window.matchMedia("(max-width: 600px)").matches) return;
    const rect = aiWindow.getBoundingClientRect();
    dragging = true; startX = e.clientX; startY = e.clientY;
    startRight = window.innerWidth - rect.right; startBottom = window.innerHeight - rect.bottom;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove", e => {
    if (!dragging) return;
    const right = Math.max(5, Math.min(window.innerWidth - 80, startRight - (e.clientX - startX)));
    const bottom = Math.max(5, Math.min(window.innerHeight - 45, startBottom - (e.clientY - startY)));
    aiWindow.style.right = right + "px"; aiWindow.style.bottom = bottom + "px";
    aiWindow.style.left = "auto";
  });
  handle.addEventListener("pointerup", () => dragging = false);
  handle.addEventListener("pointercancel", () => dragging = false);
})();

async function aiSendMessage(text) {
  const message = text.trim();
  if (!message || aiSend.disabled) return;
  aiHistory.push({ role: "user", content: message });
  aiHistory = aiHistory.slice(-40);
  aiSaveHistory();
  aiAddMessage("user", message);
  aiInput.value = "";
  aiSend.disabled = true;
  const typing = aiAddMessage("assistant", "Đang suy nghĩ...", "ai-typing");
  const context = aiHistory.slice(-12).map(m => ({ role: m.role, content: m.content }));
  try {
    const response = await fetch(AI_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "chat", level: "B2", messages: context })
    });
    const data = await response.json();
    if (!response.ok || !data.reply) throw new Error(data.error || data.details || "Không nhận được phản hồi từ AI.");
    typing.remove();
    aiHistory.push({ role: "assistant", content: data.reply });
    aiHistory = aiHistory.slice(-40);
    aiSaveHistory();
    aiAddMessage("assistant", data.reply);
  } catch (error) {
    typing.remove();
    aiAddMessage("assistant", "Tớ chưa kết nối được với AI. Cậu kiểm tra Worker đã được cập nhật phiên bản có action chat chưa nhé.\nChi tiết: " + error.message, "error");
  } finally {
    aiSend.disabled = false;
    aiInput.focus();
  }
}
aiForm.addEventListener("submit", e => {
  e.preventDefault();
  aiSendMessage(aiInput.value);
});
aiInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); aiForm.requestSubmit(); }
});
aiRenderHistory();


</script>
