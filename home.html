
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiếng Đức cùng Artificial Intelligence</title>

<!-- FONT CHỮ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   THIẾT LẬP CHUNG
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    font-family: 'Be Vietnam Pro', 'Inter', sans-serif;

    color: white;

    background-image: url("11.jpg");
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow-x: hidden;
}

/* =========================
   TIÊU ĐỀ GÓC TRÊN BÊN TRÁI
========================= */

.header {
    position: absolute;
    top: 45px;
    left: 65px;

    z-index: 10;
}

.header h1 {
    font-family: 'Be Vietnam Pro', sans-serif;

    font-size: clamp(24px, 3vw, 36px);
    font-weight: 800;
    letter-spacing: 1px;

    color: #ffffff;

    text-shadow: 0 3px 15px rgba(0,0,0,0.55);
}

/* =========================
   KHU VỰC CHÍNH
========================= */

.main {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    align-items: center;
    justify-content: flex-start;

    padding-left: 65px;
    padding-right: 30px;
}

/* =========================
   KHUNG B2
========================= */

.level-card {
    position: relative;

    width: fit-content;
    min-width: 0;
    padding: 12px 22px;

    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 0;

    background: rgba(255,255,255,0.13);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow: 0 8px 30px rgba(0,0,0,0.16);

    cursor: pointer;

    transition:
        background 0.3s ease,
        transform 0.3s ease;
}

.level-card:hover {
    background: rgba(255,255,255,0.20);
    transform: translateY(-3px);
}

/* =========================
   CHỮ B2
========================= */

.level-title {
    font-family: 'Inter', sans-serif;

    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    white-space: nowrap;

    text-align: left;
    color: white;

    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* =========================
   GỢI Ý RÊ CHUỘT
========================= */

.hint {
    display: none;
    margin-top: 8px;

    font-size: 10px;
    text-align: center;

    color: rgba(255,255,255,0.9);

    transition: opacity 0.3s ease;
}

.level-card:hover .hint,
.level-card.open .hint {
    opacity: 0;
}

/* =========================
   MENU CON - MÁY TÍNH
   SỔ NGANG SANG PHẢI
   SAU ĐÓ XẾP DỌC
========================= */

.menu {
    position: absolute;

    top: 0;
    left: calc(100% + 18px);

    width: 180px;

    display: flex;
    flex-direction: column;
    gap: 12px;

    max-height: 0;
    opacity: 0;

    overflow: hidden;

    transform: translateX(-20px);

    transition:
        max-height 0.65s ease,
        opacity 0.4s ease,
        transform 0.5s ease;
}

/* MỞ MENU */

.level-card:hover .menu,
.level-card.open .menu {
    max-height: 180px;
    opacity: 1;

    overflow: visible;

    transform: translateX(0);
}

/* =========================
   CÁC THƯ MỤC NHỎ
========================= */

.menu > a,
.menu-item > .submenu-trigger {
    display: block;
    width: 100%;
    text-decoration: none;
    color: white;
    padding: 18px 12px;
    border: 1px solid rgba(255,255,255,0.42);
    border-radius: 11px;
    background: rgba(19, 32, 55, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    opacity: 0;
    transform: translateY(-12px);
    transition:
        opacity 0.4s ease,
        transform 0.4s ease,
        background 0.3s ease,
        border-color 0.3s ease;
}

.menu-item {
    position: relative;
    width: 100%;
}

.level-card:hover .menu > a,
.level-card.open .menu > a,
.level-card:hover .menu-item > .submenu-trigger,
.level-card.open .menu-item > .submenu-trigger {
    opacity: 1;
    transform: translateY(0);
}

/* MENU CHỦ ĐỀ SỔ RA BÊN PHẢI WORTSCHATZ */
.submenu {
    position: absolute;
    top: 0;
    /* Bắt đầu sát mép Wortschatz; phần đệm tạo cầu hover vô hình,
       giúp con trỏ không bị rơi khỏi mục khi di chuyển sang submenu. */
    left: 100%;
    width: 194px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 0 0 14px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateX(-12px);
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
}

.menu-item:hover > .submenu,
.menu-item:focus-within > .submenu,
.menu-item.submenu-open > .submenu {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(0);
}

.submenu a {
    display: block;
    width: 100%;
    padding: 13px 12px;
    border: 1px solid rgba(255,255,255,0.42);
    border-radius: 11px;
    background: rgba(19, 32, 55, 0.90);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: white;
    text-decoration: none;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    transition: background 0.3s ease, border-color 0.3s ease;
}

.submenu a:hover,
.menu > a:hover,
.menu-item > .submenu-trigger:hover {
    background: rgba(43, 61, 91, 0.97);
    border-color: rgba(255,255,255,0.9);
}

/* CHỮ TRONG MENU */

.menu h2 {
    font-size: 15px;
    font-weight: 600;

    margin-bottom: 5px;
}

.menu p {
    font-size: 12px;
    color: #ffffff;
}

/* =========================
   SLOGAN GÓC DƯỚI BÊN TRÁI
========================= */

.footer {
    position: absolute;

    bottom: 35px;
    left: 65px;

    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;

    color: #ffffff;

    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
}

/* =========================
   ĐIỆN THOẠI VÀ MÀN HÌNH NHỎ
========================= */

@media (max-width: 600px) {

    body {
        background-attachment: scroll;
    }

    /* TIÊU ĐỀ */

    .header {
        top: 28px;
        left: 25px;
        right: 20px;
    }

    .header h1 {
        font-size: clamp(21px, 6vw, 26px);
        line-height: 1.4;
    }

    /* KHU VỰC CHÍNH */

    .main {
        justify-content: center;

        padding-left: 20px;
        padding-right: 20px;

        padding-top: 100px;
        padding-bottom: 100px;
    }

    /* KHUNG B2 */

    .level-card {
        width: fit-content;
        min-width: 0;
        padding: 12px 22px;
    }

    /* MENU CHUYỂN XUỐNG BÊN DƯỚI B2 */

    .menu {
        position: static;

        width: 180px;

        display: flex;
        flex-direction: column;
        gap: 12px;

        max-height: 0;
        margin-top: 0;

        transform: translateY(-12px);
    }

    .level-card:hover .menu,
    .level-card.open .menu {
        max-height: 700px;
        margin-top: 16px;

        opacity: 1;
        transform: translateY(0);

        overflow: visible;
    }

    /* THƯ MỤC NHỎ */

    .menu > a,
    .menu-item > .submenu-trigger {
        padding: 16px 12px;
    }

    /* Trên điện thoại, menu chủ đề mở xuống bên dưới Wortschatz */
    .menu-item {
        position: static;
    }

    .submenu {
        position: static;
        width: 100%;
        max-height: 0;
        margin-top: 0;
        padding-left: 12px;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-8px);
        transition: max-height 0.35s ease, opacity 0.3s ease, transform 0.3s ease, margin 0.3s ease;
    }

    .menu-item:hover > .submenu,
    .menu-item:focus-within > .submenu,
    .menu-item.submenu-open > .submenu {
        max-height: 500px;
        margin-top: 10px;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
    }

    .submenu a {
        padding: 13px 12px;
    }

    .menu h2 {
        font-size: 15px;
    }

    .menu p {
        font-size: 12px;
    }

    /* SLOGAN */

    .footer {
        left: 25px;
        bottom: 25px;

        font-size: 11px;
        letter-spacing: 0.5px;
    }
}

/* =========================
   TABLET
========================= */

@media (min-width: 601px) and (max-width: 900px) {

    .header {
        left: 40px;
        top: 35px;
    }

    .main {
        padding-left: 40px;
    }

    .footer {
        left: 40px;
    }

}

/* =========================
   GIẢM CHUYỂN ĐỘNG
========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
    }

}


/* =========================
   MENU PHONG CACH WINDOWS CLASSIC
   Chi thay doi bo cuc, giu nguyen mau sac hien tai
========================= */

/* Khung menu chinh: cac muc nam lien tiep nhu context menu Windows */
.menu {
    width: 190px;
    gap: 0;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.42);
    background: rgba(19, 32, 55, 0.88);
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

/* Moi muc la mot dong ngang, can le trai */
.menu > a,
.menu-item > .submenu-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 43px;
    padding: 9px 12px;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    text-align: left;
}

/* Giu nguyen mau chu va mau nen hover da co */
.menu > a:hover,
.menu-item > .submenu-trigger:hover {
    background: rgba(43, 61, 91, 0.97);
}

/* Hien thi tieu de tren mot dong; an dong mo ta de giong menu Windows */
.menu h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
}

.menu p {
    display: none;
}

/* Mui ten ben phai cho muc co menu con */
.menu-item > .submenu-trigger::after {
    content: "›";
    margin-left: 18px;
    font-size: 23px;
    line-height: 1;
    font-weight: 400;
}

/* Menu con: cac chu de xep thanh danh sach lien tuc */
.submenu {
    width: 194px;
    gap: 0;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.42);
    background: rgba(19, 32, 55, 0.90);
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

.submenu a {
    min-height: 39px;
    padding: 10px 13px;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    text-align: left;
    font-size: 13px;
}

/* Duong ngan cach giua cac muc, dung cung tong mau hien tai */
.menu > a + .menu-item {
    border-top: 1px solid rgba(255,255,255,0.28);
}

.submenu a + a {
    border-top: 1px solid rgba(255,255,255,0.20);
}

/* Mobile: giu cach mo menu cam ung, chi chuyen danh sach xuong dong */
@media (max-width: 600px) {
    .menu {
        width: 180px;
        border: 1px solid rgba(255,255,255,0.42);
    }

    .menu > a,
    .menu-item > .submenu-trigger {
        min-height: 43px;
        padding: 10px 12px;
    }

    .submenu {
        width: 100%;
        border: 1px solid rgba(255,255,255,0.42);
    }

    .submenu a {
        min-height: 38px;
        padding: 10px 12px;
    }
}


/* =========================
   MO RONG 4 CAP DO A1-A2-B1-B2
   Giu nguyen tong mau va phong cach Windows Classic
========================= */
.main {
    justify-content: flex-start;
    align-items: center;
}

.level-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
}

.level-card {
    width: 92px;
    min-width: 92px;
    padding: 10px 14px;
}

.level-title {
    font-size: 24px;
    letter-spacing: 2px;
}

.level-card:hover .menu,
.level-card.open .menu {
    max-height: 520px;
}

.menu-item > .submenu-trigger {
    cursor: pointer;
}

/* Dấu phân cách cho mọi mục menu cấp độ */
.menu > a + .menu-item,
.menu > .menu-item + .menu-item {
    border-top: 1px solid rgba(255,255,255,0.28);
}

/* Bố cục menu trên điện thoại */
@media (max-width: 600px) {
    .main {
        justify-content: center;
        padding-top: 115px;
        padding-bottom: 100px;
    }

    .level-list {
        width: 100%;
        align-items: center;
        gap: 12px;
    }

    .level-card {
        width: 92px;
        min-width: 92px;
        padding: 10px 14px;
    }

    .level-card:hover .menu,
    .level-card.open .menu {
        max-height: 1000px;
    }

    .menu {
        width: 210px;
    }
}


/* =========================
   MENU CAP DO: MO NGANG SANG PHAI TREN MAY TINH
   Giu nguyen mau sac va phong cach Windows Classic
========================= */
@media (min-width: 601px) {
    .level-list {
        overflow: visible;
    }

    .level-card {
        position: relative;
        overflow: visible;
    }

    /* Menu cua ca 4 cap do se mo ngang, voi mep duoi cung hang voi mep duoi B2. */
    .level-card > .menu {
        position: absolute;
        top: 0; /* JavaScript tinh lai top de can mep duoi theo B2 */
        left: calc(100% + 18px);
        right: auto;
        width: 230px;
        max-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateX(-12px);
        transform-origin: left bottom;
        z-index: 100;
        transition: max-height .35s ease, opacity .25s ease,
                    transform .25s ease, visibility .25s ease;
    }

    /* Menu con canh giua theo chinh hang A1, A2, B1 hoac B2 dang duoc hover.
       Vi vay bang menu luon mo ngang sang phai, khong bi day xuong duoi. */
    .level-card:hover > .menu,
    .level-card.open > .menu,
    .level-card:focus-within > .menu {
        max-height: 600px;
        overflow: visible;
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
    }

    /* Moi muc co menu con deu mo tiep sang phai, canh theo dung hang cua muc do. */
    /* Menu chu de Wortschatz mo sang phai va can mep duoi cung hang B2. */
    .menu-item {
        position: relative;
    }

    .menu-item > .submenu {
        position: absolute;
        top: auto;
        bottom: 0;
        left: 100%;
        right: auto;
        margin: 0;
        z-index: 110;
        transform: translateX(-12px);
        transform-origin: left bottom;
    }

    .menu-item:hover > .submenu,
    .menu-item:focus-within > .submenu,
    .menu-item.submenu-open > .submenu {
        transform: translateX(0);
    }
}

/* Nhãn Wortschatz hiển thị rõ phần giải nghĩa tiếng Việt */
.menu-item > .submenu-trigger h2 {
    white-space: nowrap;
}


/* =========================
   CAN CHINH KICH THUOC VA VI TRI MENU
   Giu nguyen mau sac va cac chuc nang hien tai
========================= */
@media (min-width: 601px) {
    /* Tang kich thuoc 4 thu muc cap do va tao them khoang cach */
    .level-list {
        gap: 16px;
    }

    .level-card {
        width: 108px;
        min-width: 108px;
        padding: 13px 16px;
    }

    .level-title {
        font-size: 27px;
        letter-spacing: 2.5px;
    }

    /* Bo cac lech vi tri rieng tung cap do: tat ca dung chung mep duoi B2. */
}

@media (max-width: 600px) {
    /* Tren dien thoai giu kich thuoc va khoang cach vua man hinh */
    .level-list {
        gap: 14px;
    }

    .level-card {
        width: 100px;
        min-width: 100px;
        padding: 12px 14px;
    }

    .level-title {
        font-size: 25px;
    }
}


/* SCHREIBEN: dinh dang cac dong Goethe va telc theo Windows Classic */
@media (min-width: 601px) {
    .schreiben-menu > .submenu {
        bottom: 0;
        top: auto;
        left: 100%;
        margin: 0;
    }

    .schreiben-menu > .submenu > .menu-item {
        position: relative;
    }

    .schreiben-menu > .submenu > .menu-item > .submenu-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 39px;
        padding: 10px 13px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: white;
        text-decoration: none;
        text-align: left;
        font-size: 13px;
        font-weight: 600;
    }

    .schreiben-menu > .submenu > .menu-item > .submenu-trigger:hover {
        background: rgba(43, 61, 91, 0.97);
    }

    .schreiben-menu > .submenu > .menu-item > .submenu-trigger::after {
        content: "›";
        margin-left: 14px;
        font-size: 21px;
        line-height: 1;
    }

    .schreiben-menu > .submenu > .menu-item > .submenu {
        top: auto;
        bottom: 0;
        left: 100%;
        margin: 0;
    }
}


/* =========================
   BON THU MUA CHO 4 THU MUC LON A1-A2-B1-B2
   Chi tac dong den 4 level-card; khong thay doi menu con
========================= */

.level-card.season-spring {
    background:
        radial-gradient(circle at 88% 18%, rgba(255,224,238,.24), transparent 34%),
        linear-gradient(145deg, rgba(117,180,132,.34), rgba(53,112,91,.25));
    border-color: rgba(203,245,205,.72);
    box-shadow: 0 8px 28px rgba(35,91,60,.22), inset 0 0 18px rgba(224,255,225,.07);
}

.level-card.season-spring::after {
    content: "";
    color: rgba(231,255,229,.86);
}

.level-card.season-summer {
    background:
        radial-gradient(circle at 88% 18%, rgba(255,218,112,.42), transparent 35%),
        linear-gradient(145deg, rgba(230,126,42,.48), rgba(190,75,42,.34));
    border-color: rgba(255,204,132,.88);
    box-shadow: 0 8px 28px rgba(155,75,24,.26), inset 0 0 18px rgba(255,230,180,.10);
}

.level-card.season-summer::after {
    content: "";
    color: rgba(255,246,211,.90);
}

.level-card.season-autumn {
    background:
        radial-gradient(circle at 88% 18%, rgba(255,197,126,.28), transparent 35%),
        linear-gradient(145deg, rgba(174,99,55,.38), rgba(111,70,65,.30));
    border-color: rgba(255,203,157,.76);
    box-shadow: 0 8px 28px rgba(105,55,30,.22), inset 0 0 18px rgba(255,224,190,.07);
}

.level-card.season-autumn::after {
    content: "";
    color: rgba(255,229,205,.90);
}

.level-card.season-winter {
    background:
        radial-gradient(circle at 88% 18%, rgba(235,250,255,.48), transparent 36%),
        linear-gradient(145deg, rgba(126,190,230,.46), rgba(48,91,158,.48));
    border-color: rgba(226,248,255,.94);
    box-shadow: 0 8px 28px rgba(28,72,132,.30), inset 0 0 20px rgba(235,250,255,.16);
}

.level-card.season-winter::after {
    content: "";
    color: rgba(236,249,255,.92);
}

/* Nhan mua nho nam ben trong goc duoi cua tung thu muc lon */
.level-card.season-spring::after,
.level-card.season-summer::after,
.level-card.season-autumn::after,
.level-card.season-winter::after {
    position: absolute;
    right: 7px;
    bottom: 5px;
    font-family: 'Inter', sans-serif;
    font-size: 6px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
    pointer-events: none;
    opacity: .9;
}

/* Hieu ung hover rieng cho 4 thu muc lon, khong anh huong submenu */
.level-card.season-spring:hover {
    background:
        radial-gradient(circle at 88% 18%, rgba(255,224,238,.36), transparent 34%),
        linear-gradient(145deg, rgba(133,198,146,.48), rgba(60,133,106,.38));
}

.level-card.season-summer:hover {
    background:
        radial-gradient(circle at 88% 18%, rgba(255,226,132,.52), transparent 35%),
        linear-gradient(145deg, rgba(245,139,42,.60), rgba(204,76,39,.48));
}

.level-card.season-autumn:hover {
    background:
        radial-gradient(circle at 88% 18%, rgba(255,197,126,.40), transparent 35%),
        linear-gradient(145deg, rgba(190,112,65,.52), rgba(128,79,71,.40));
}

.level-card.season-winter:hover {
    background:
        radial-gradient(circle at 88% 18%, rgba(244,253,255,.58), transparent 36%),
        linear-gradient(145deg, rgba(150,213,245,.62), rgba(55,105,183,.58));
}



/* =========================
   BANG MAU MOI: MAU MIN, PHANG, KHONG HIEU UNG BONG/PHAT SANG
   Chi ghi de mau sac va hieu ung; giu nguyen cau truc va chuc nang.
========================= */

/* Loai bo bong do va bong chu */
.level-card,
.menu,
.submenu,
.menu > a,
.menu-item > .submenu-trigger,
.submenu a {
    box-shadow: none !important;
    text-shadow: none !important;
    backdrop-filter: none !important;

/* Chi chay hieu ung mua khi di chuot vao tung thu muc */
.level-card.season-spring:hover::before {

}
.level-card.season-spring:hover::after {

.level-card.season-summer:hover::before {

}
.level-card.season-summer:hover::after {

}

.level-card.season-autumn:hover::before {

}
.level-card.season-autumn:hover::after {

}

.level-card.season-winter:hover::before {

}
.level-card.season-winter:hover::after {

/* Chuyen dong rieng cho tung mua */
@keyframes springFlowerFloat {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-4px) rotate(8deg); }
}

@keyframes springPetalDrift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: .65; }
    50% { transform: translate(-3px, 4px) rotate(35deg); opacity: 1; }
}

@keyframes summerSunPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.16) rotate(12deg); }
}

@keyframes summerSparkle {
    0%, 100% { transform: scale(.75); opacity: .45; }
    50% { transform: scale(1.2); opacity: 1; }
}

@keyframes autumnLeafFall {
    0%, 100% { transform: translate(0, 0) rotate(-8deg); }
    50% { transform: translate(-3px, 5px) rotate(24deg); }
}

@keyframes autumnLeafDrift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: .7; }
    50% { transform: translate(-4px, 5px) rotate(-30deg); opacity: 1; }
}

@keyframes winterSnowTurn {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(45deg) scale(1.12); }
}

@keyframes winterSnowTwinkle {
    0%, 100% { transform: scale(.7); opacity: .45; }
    50% { transform: scale(1.25); opacity: 1; }
}

/* Ton trong cai dat giam chuyen dong cua thiet bi */

<!-- =========================
     TƯƠNG TÁC MÁY TÍNH VÀ ĐIỆN THOẠI
========================= -->

<script>
const touchDevice = window.matchMedia("(hover: none)");
const levelCards = document.querySelectorAll(".level-card");

// Bang LED tu dong thay cau cham ngon moi sau moi 3 phut.
const quoteLedItems = [
    "Học, học nữa, học mãi.",
    "Có công mài sắt, có ngày nên kim.",
    "Có công mài sắc, có ngày nên kim.",
    "Những điều vĩ đại không được xây dựng bằng sự vội vàng.",
    "Kỷ luật hôm nay tạo nên tự do ngày mai.",
    "Kiên trì là con đường dẫn đến thành công.",
    "Mỗi ngày tiến một bước, rồi cậu sẽ đi rất xa.",
    "Wissen ist Macht – Tri thức là sức mạnh."
];
const quoteLedText = document.getElementById("quoteLedText");
let quoteLedIndex = 0;
window.setInterval(() => {
    quoteLedText.classList.add("is-changing");
    window.setTimeout(() => {
        quoteLedIndex = (quoteLedIndex + 1) % quoteLedItems.length;
        quoteLedText.textContent = quoteLedItems[quoteLedIndex];
        quoteLedText.classList.remove("is-changing");
    }, 450);
}, 180000);

// Can mep duoi menu cap do va menu Wortschatz theo mep duoi cua thu muc B2.
function alignLevelMenusToB2() {
    if (touchDevice.matches || window.innerWidth <= 600) return;
    const b2 = document.getElementById("levelB2");
    if (!b2) return;
    const b2Bottom = b2.getBoundingClientRect().bottom;

    levelCards.forEach((card) => {
        const menu = card.querySelector(":scope > .menu");
        if (!menu) return;
        const cardTop = card.getBoundingClientRect().top;
        const menuHeight = menu.scrollHeight;
        menu.style.top = `${b2Bottom - cardTop - menuHeight}px`;
    });
}

// Cap nhat lai vi tri khi hover, focus hoac thay doi kich thuoc cua so.
levelCards.forEach((card) => {
    card.addEventListener("mouseenter", alignLevelMenusToB2);
    card.addEventListener("focusin", alignLevelMenusToB2);
});
window.addEventListener("resize", alignLevelMenusToB2);

// Tren may tinh: hover vao tung cap do de mo menu.
// Tren dien thoai: cham vao ten cap do de mo/dong menu.
levelCards.forEach((card) => {
    card.addEventListener("click", function(event) {
        if (touchDevice.matches && !event.target.closest("a")) {
            card.classList.toggle("open");
        }
    });

    // Tren dien thoai, moi muc co submenu deu co the mo bang cham.
    card.querySelectorAll(".submenu-trigger").forEach((trigger) => {
        const submenuItem = trigger.closest(".menu-item");

        trigger.addEventListener("click", function(event) {
            event.preventDefault();
            if (touchDevice.matches) {
                const isOpen = submenuItem.classList.toggle("submenu-open");
                trigger.setAttribute("aria-expanded", String(isOpen));
            }
        });
    });
});

window.addEventListener("load", alignLevelMenusToB2);

// Dong tat ca menu khi nhan Escape.
document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        levelCards.forEach((card) => {
            card.classList.remove("open");
            card.querySelectorAll(".menu-item.submenu-open").forEach((item) => {
                item.classList.remove("submenu-open");
            });
            card.querySelectorAll(".submenu-trigger").forEach((trigger) => {
                trigger.setAttribute("aria-expanded", "false");
            });
        });
    }
});
</script>
